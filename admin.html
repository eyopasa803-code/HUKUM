<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Kontrol - HÜKÜM Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="kilit-ekrani">
  <div class="kutu">
    <h2>🔒 Site Kontrol</h2>
    <input type="password" id="sifre-giris" placeholder="Şifre">
    <button onclick="girisYap()" style="width:100%">Giriş</button>
    <p id="hata-mesaj" style="color:#e5534b;font-size:13px"></p>
  </div>
</div>

<div class="sidebar gizli" id="panel-govde">
  <h1>⚙️ Kontrol Paneli</h1>
  <div class="grup">YÖNETİM</div>
  <a onclick="sekmeAc('t-duyuru', this)" class="active">📢 Duyurular</a>
  <a onclick="sekmeAc('t-magaza', this)">🛍️ Mağaza Yönetimi</a>
  <a onclick="sekmeAc('t-kanallar', this)">📺 Discord Kanalları</a>
  <a onclick="sekmeAc('t-roller', this)">🎖️ Rütbeler</a>
  <a onclick="sekmeAc('t-uyeler', this)">👤 Üyeler</a>
  <div class="grup">SİSTEM</div>
  <a href="index.html">⬅ Siteye Dön</a>
</div>

<div class="content gizli" id="panel-icerik">
  <div id="t-duyuru" class="tab-icerik aktif">
    <h2>📢 Duyuru Ekle</h2>
    <input id="d-baslik" placeholder="Başlık">
    <textarea id="d-metin" placeholder="Metin" rows="3"></textarea>
    <button onclick="duyuruEkle()">Ekle</button>
    <div id="d-liste"></div>
  </div>

  <div id="t-magaza" class="tab-icerik">
    <h2>🛍️ Mağaza Ürünü Ekle</h2>
    <input id="m-isim" placeholder="Ürün İsmi">
    <textarea id="m-aciklama" placeholder="Açıklama" rows="2"></textarea>
    <input id="m-fiyat" type="number" placeholder="Fiyat (Puan)">
    <button onclick="magazaEkle()">Ürün Ekle</button>
    <div id="m-liste"></div>
  </div>

  <div id="t-kanallar" class="tab-icerik">
    <h2>📺 Senkronize Edilen Kanallar</h2>
    <div id="kanal-liste"></div>
  </div>

  <div id="t-roller" class="tab-icerik">
    <h2>🎖️ Discord Rolleri</h2>
    <div id="rol-liste"></div>
  </div>

  <div id="t-uyeler" class="tab-icerik">
    <h2>👤 Kayıtlı Üyeler</h2>
    <div id="u-liste"></div>
  </div>
</div>

<script>
const SIFRE = "HÜKÜM_SUNAR";
const JSONBIN_ID  = "6ab4ff86ffd5d160532a06e6";
const JSONBIN_KEY = "$2a$10$er0sdkCga7cQosz.G3MBDebUxm2k3JDpu1b5Slpu1qKW.sJ/zONyW";
const JSONBIN_URL = "https://api.jsonbin.io/v3/b/" + JSONBIN_ID;

let veri = {};

function girisYap(){
  if(document.getElementById('sifre-giris').value === SIFRE){
    document.getElementById('kilit-ekrani').style.display='none';
    document.getElementById('panel-govde').classList.remove('gizli');
    document.getElementById('panel-icerik').classList.remove('gizli');
    document.body.style.display='flex';
    verileriYukle();
  } else { document.getElementById('hata-mesaj').innerText = 'Şifre yanlış.'; }
}

function sekmeAc(id, el){
  document.querySelectorAll('.tab-icerik').forEach(e=>e.classList.remove('aktif'));
  document.getElementById(id).classList.add('aktif');
  document.querySelectorAll('#panel-govde a').forEach(a=>a.classList.remove('active'));
  if(el) el.classList.add('active');
}

function verileriYukle(){
  fetch(JSONBIN_URL + '/latest', { headers: { 'X-Master-Key': JSONBIN_KEY } })
    .then(r => r.json()).then(d => { veri = d.record; listeleriCiz(); });
}

function kaydet(){
  fetch(JSONBIN_URL, { method:'PUT', headers:{ 'Content-Type':'application/json', 'X-Master-Key':JSONBIN_KEY }, body: JSON.stringify(veri) })
    .then(() => listeleriCiz());
}

function duyuruEkle(){
  const baslik = document.getElementById('d-baslik').value.trim();
  const metin = document.getElementById('d-metin').value.trim();
  if(!baslik) return;
  if(!veri.duyurular) veri.duyurular = [];
  veri.duyurular.push({ id: Date.now(), baslik, metin, tarih: new Date().toISOString().slice(0,10) });
  kaydet();
}

function magazaEkle(){
  const isim = document.getElementById('m-isim').value.trim();
  const aciklama = document.getElementById('m-aciklama').value.trim();
  const fiyat = parseInt(document.getElementById('m-fiyat').value) || 0;
  if(!isim) return;
  if(!veri.magaza) veri.magaza = [];
  veri.magaza.push({ id: Date.now(), isim, aciklama, fiyat });
  kaydet();
}

function listeleriCiz(){
  document.getElementById('d-liste').innerHTML = (veri.duyurular||[]).map(d => `<div class="kart">${d.baslik}</div>`).join('');
  document.getElementById('m-liste').innerHTML = (veri.magaza||[]).map(m => `<div class="kart">${m.isim} - ${m.fiyat} Puan</div>`).join('');
  document.getElementById('kanal-liste').innerHTML = (veri.kanallar||[]).map(k => `<div class="kart">📺 #${k.isim}</div>`).join('') || '<p>Kanal yok.</p>';
  document.getElementById('rol-liste').innerHTML = (veri.roller||[]).map(r => `<div class="kart" style="color:${r.renk}">🎖️ ${r.isim}</div>`).join('') || '<p>Rol yok.</p>';
  document.getElementById('u-liste').innerHTML = (veri.uyeler||[]).map(u => `<div class="kart">👤 ${u.kullaniciAdi}</div>`).join('') || '<p>Üye yok.</p>';
}
</script>
</body>
</html>
