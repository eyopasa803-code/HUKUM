<script>

/* ====== AYARLAR ====== */
const BIN='6ab4ff86ffd5d160532a06e6';
const MASTER='$2a$10$KZk6tJKQc1ZgnkKrdRU80ex6YHybL2EZXS1C8.7MMLOJKVHtutajK';
const ACCESS='';

const QS=[{"q":"Eyo Paşa'nın isim soy ismi nedir?","a":["913a55efbe2ae4f013288906412584547ed3c05e81e6d495ccb8ca83aba08324","ead499caebf9a9546cfc9214ddaa7c9a009fe84a0a78dd0755c1f7d0c285bd47","32efb555b34cbe3132a89f89a5a9999aea22bceab591d01ed6e492674eecf6d5"],"m":3},{"q":"Eyo Paşa kaç yıldır sanalcıdır?","a":["b918fce4172bf952e585d16c7200057d0708d2c1e55cf42b05eb698bcf5820f2","afae886cfd972f8635937a6d41e39089726c3336d53a6161aa7eb3659fcd8f96"],"m":1},{"q":"Eyo Paşa projelerinin isminin başına ne yazar ve neden?","a":["c5494106df63b17b2b0ad96b4e8996d4b7cd2ba473743a2b22254ac1393f3a7b","638e208227bbe7cc095c6293e195412f30085351e0193f1b8c8418026430a438","70cafa4ad2e1a637f5e029c6583dc40a2be06e72cc6c13780db421b242e32470","de203c83a47544e3e4954c8d827d7af9b6405d44970c9016077cf44a9401d08a","76f8410aba04bcf4e9b3184f3b5fa32d379638d7cd5af57c77cd7d95b61f807c"],"m":2},{"q":"Eyo Paşa'nın ilk projesi nedir?","a":["69d78ac88809d63fc83576b4beab4d95265a39e5cde2ac3cdb250a279b379d80"],"m":1},{"q":"Eyo Paşa'nın en sevdiği şey nedir?","a":["062294e49ac5f96b576c412af719bed5d545e287a53a287781d5ad9cfe0357ce","e8c62cbada62a5e94126666bf4b28be701f8d297b6531bb0680b1736a166c034","795f5da238d094f65fef6348febdab3ac650e730fb4642b3f27d384b41e6efc1","594d364a480dbd57909bb8ef4502a4398a36deabc9f05e73aeb7780534cf9709"],"m":1}];

const RULES=['Herkese saygılı ol; hakaret, küfür ve aşağılama yasaktır.','Irkçılık, nefret söylemi, siyasi ve dini tartışma açma.','Spam, flood ve gereksiz etiket/tekrar mesaj yasaktır.','Reklam ve başka sunucu/site tanıtımı yetkili izni olmadan yasaktır.','Sadece kendi iş kolunun kanallarında o işe uygun içerik paylaş.','Kod deposundaki kodlar ekibe aittir; izinsiz paylaşmak yasaktır.','Yetkililerin kararlarına saygı göster; itirazını özelden ilet.','Başkasının hesabını/kodunu kullanmak, hesap çalmak yasaktır.','Ekip çalışması ve dostluk önceliğimizdir: yardımlaş, paylaş, birlikte üret.','Kurallara uymayanlar uyarılır; tekrarında yetkisi/erişimi alınır.'];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let DB=null,ME=null,CH=null,mode=0;

/* ====== JSONBIN ====== */
function norm(d){d=d&&typeof d==='object'?d:{};d.users=d.users||{};d.msgs=d.msgs||{};d.snips=d.snips||[];d.done=d.done||[];d.social=d.social||[];d.about=d.about||'';d.locked=!!d.locked;d.lessons=d.lessons||[];d.subs=d.subs||[];return d}
let AUTH={};async function jb(method,body){
 const ks=[['X-Master-Key',MASTER],['X-Access-Key',MASTER],['X-Access-Key',ACCESS],['X-Master-Key',ACCESS]].filter(x=>x[1]&&x[1].length>10);
 if(!ks.length)throw new Error('Key girilmemiş: kodun başındaki MASTER satırına Master Key yaz.');
 const idx=ks.map((_,i)=>i);if(AUTH[method]!=null)idx.sort((a,b)=>(b==AUTH[method])-(a==AUTH[method]));
 let r;const log=[];
 for(const i of idx){
  const hd={[ks[i][0]]:ks[i][1]};if(body)hd['Content-Type']='application/json';
  try{r=await fetch('https://api.jsonbin.io/v3/b/'+BIN+(method=='GET'?'/latest':''),{method,headers:hd,body})}
  catch(e){throw new Error("jsonbin'e ulaşılamadı (internet, VPN veya reklam engelleyici olabilir)")}
  if(r.status!=401&&r.status!=403){AUTH[method]=i;break}
  log.push(ks[i][0].slice(2,8)+':'+r.status)
 }
 if(r.status==401||r.status==403)throw new Error('Key reddedildi ('+log.join(', ')+'). Master/Access key yanlış ya da izinsiz. Access key için Read ve Update izni ver ve bu bin\'e erişimi aç.');
 if(r.status==404)throw new Error('Bin bulunamadı (404): Bin ID yanlış olabilir.');
 if(r.status==422||r.status==400)throw new Error('jsonbin isteği reddetti ('+r.status+'). Bin içeriği geçerli JSON olmalı, örn: {}');
 if(!r.ok)throw new Error('jsonbin hata: '+r.status);
 return r.json();
}
async function load(){const j=await jb('GET');return norm(j&&j.metadata&&j.record!==undefined?j.record:j)}
async function save(d){const body=JSON.stringify(d);if(body.length>95000)throw new Error('Veri alanı doldu (jsonbin 100KB sınırı). Eski kod/ekran görüntüsü silin.');await jb('PUT',body)}
async function mut(fn){const d=await load();const k=ME&&ME.name?uk(ME.name):null,t0=k&&d.users[k]?tier(d.users[k].xp||0):0;const res=await fn(d);await save(d);DB=d;ME=me();if(k&&d.users[k]&&tier(d.users[k].xp||0)>t0)setTimeout(()=>toast('🎉 TERFİ! Yeni rütbe: '+rankT(d.users[k])),400);return res}
function sha256(msg){
 const R=(x,n)=>(x>>>n)|(x<<(32-n)),K=[],H=[];let p=2,c=0;
 while(c<64){let ok=true;for(let i=2;i*i<=p;i++)if(p%i==0){ok=false;break}
  if(ok){if(c<8)H[c]=((Math.pow(p,.5)%1)*4294967296)|0;K[c]=((Math.pow(p,1/3)%1)*4294967296)|0;c++}p++}
 const b=new TextEncoder().encode(msg),l=b.length,n=((l+9+63)>>6)<<6,w=new Uint8Array(n);w.set(b);w[l]=128;
 const dv=new DataView(w.buffer);dv.setUint32(n-4,(l*8)>>>0);dv.setUint32(n-8,Math.floor(l/536870912));
 for(let o=0;o<n;o+=64){const W=[];for(let i=0;i<16;i++)W[i]=dv.getUint32(o+i*4)|0;
  for(let i=16;i<64;i++){const a=W[i-15],d=W[i-2];W[i]=(W[i-16]+(R(a,7)^R(a,18)^(a>>>3))+W[i-7]+(R(d,17)^R(d,19)^(d>>>10)))|0}
  let [a,b2,c2,d,e,f,g,h]=H;
  for(let i=0;i<64;i++){const t1=(h+(R(e,6)^R(e,11)^R(e,25))+((e&f)^(~e&g))+K[i]+W[i])|0,t2=((R(a,2)^R(a,13)^R(a,22))+((a&b2)^(a&c2)^(b2&c2)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=c2;c2=b2;b2=a;a=(t1+t2)|0}
  H[0]=(H[0]+a)|0;H[1]=(H[1]+b2)|0;H[2]=(H[2]+c2)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0}
 return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
async function sha(s){try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}return sha256(s)}
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3200)};

const uk=n=>n.trim().toLowerCase();
function me(){return DB&&ME?DB.users[uk(ME.name)]||null:null}
const rank=u=>u&&u.staff?RANKS.indexOf(u.staff):99;
const isStaff=u=>rank(u)<99;
const canCode=u=>isStaff(u)||(u&&u.kod);
function tab(m){mode=m;$('tl').className=m?'':'on';$('tr').className=m?'on':'';$('go').textContent=m?'Kayıt Ol':'Giriş Yap';$('aerr').style.display='none'}
async function auth(){
 const name=$('un').value.trim(),code=$('uc').value,e=$('aerr');e.style.display='none';
 try{
  if(name.length<3)throw new Error('Kullanıcı adı en az 3 karakter olmalı.');if(mode&&(!/^[\p{L}\p{N}_. -]+$/u.test(name)||name.includes('__')))throw new Error('Kullanıcı adında sadece harf, rakam, boşluk, nokta, tire ve alt çizgi olabilir.');
  if(code.length<4)throw new Error('Kod en az 4 karakter olmalı.');
  const h=await sha(SALT+uk(name)+code);$('go').disabled=true;
  if(mode){await mut(d=>{if(d.users[uk(name)])throw new Error('Bu kullanıcı adı alınmış.');d.users[uk(name)]={name,h,staff:null,job:null,kod:false,ts:Date.now()}})}
  else{DB=await load();const u=DB.users[uk(name)];if(!u||u.h!==h)throw new Error('Kullanıcı adı veya kod yanlış.')}
  ME={name:DB.users[uk(name)].name};localStorage.setItem('hs_me',JSON.stringify({n:name,h}));enter();
 }catch(x){e.textContent=x.message;e.style.display='block'}
 $('go').disabled=false;
}
function logout(){localStorage.removeItem('hs_me');location.hash='';location.reload()}
async function enter(){
 $('welcome').style.display='none';$('app').classList.add('on');
 CH=location.hash.startsWith('#/c/')?location.hash.slice(4):'pano';
 if(!chList().some(c=>c.id==CH))CH='pano';draw();daily();
}

/* ====== KANALLAR ====== */
function chList(){
 const u=me(),a=GEN.map(([id,n,i,t])=>({id,n,i,t}));
 JOBS.forEach(([j,jn,ji])=>{if(rank(u)<=3||u.job==j)a.push({id:j+'-hub',n:'Bölüm Ana Sayfası',i:'🏠',t:'hub',job:j},{id:j+'-genel',n:'Genel',i:'💭',t:'chat',job:j},{id:j+'-gorev',n:'Görevler',i:'✅',t:'feed',w:1,job:j},{id:j+'-duyuru',n:'Duyurular',i:'📣',t:'feed',w:1,job:j},{id:j+'-atolye',n:'Atölye (Fabrika)',i:'🏭',t:'work',job:j})});
 DB.lessons.filter(l=>lst(l)=='live'&&(isStaff(u)||inL(l,u.name))).forEach(l=>{const t=l.title.slice(0,22);a.push({id:'L:'+l.id+':i',n:'İçerik · '+t,i:'📚',t:'info',les:l.id},{id:'L:'+l.id+':w',n:'Atölye · '+t,i:'🛠️',t:'chat',les:l.id},{id:'L:'+l.id+':c',n:'Sohbet · '+t,i:'💬',t:'chat',les:l.id},{id:'L:'+l.id+':l',n:'Lab · '+t,i:'🧪',t:'lab',les:l.id},{id:'L:'+l.id+':t',n:'Test · '+t,i:'📝',t:'ltest',les:l.id})});
 if(isEgt(u)||isDen(u))a.push({id:'dersver',n:'Ders Ver',i:'🎓',t:'teach'});
 if(canCode(u))a.push({id:'kod',n:'Kod Deposu',i:'💻',t:'code'});
 return a;
}
function go(id){CH=id;$('side').classList.remove('open');draw()}
function draw(){
 const u=me();if(!u){logout();return}
 const jn=JOBS.find(j=>j[0]==u.job);
 $('me').innerHTML=`<b>${esc(u.name)}</b>${u.staff?`<span class="badge">${esc(u.staff)}</span>`:'<span class="badge j">Üye</span>'}${u.kod&&!isStaff(u)?'<span class="badge">Kod Ekibi</span>':''}${u.egt?'<span class="badge">Eğitmen</span>':''}${u.den?'<span class="badge">Denetmen</span>':''}<div style="color:var(--mu);font-size:13px;margin-top:6px">${jn?jn[2]+' '+jn[1]:'İş kolu seçilmedi'}</div><div style="font-size:13px;margin-top:4px">${esc(rankT(u))} · ${u.xp||0} XP</div>`;
 const L=chList(),btn=c=>`<button class="ch ${c.id==CH?'on':''}" onclick="go('${c.id}')">${c.i} ${esc(c.n)}</button>`;
 let h='<div class="sec">Genel</div>'+L.filter(c=>!c.job&&c.id!='kod'&&c.id!='dersver'&&!c.les).map(btn).join('');
 if(hasJob(u))h+=`<div class="sec">${jn[2]} Bölümüm</div>`+L.filter(c=>c.job==u.job).map(btn).join('');else h+='<div class="sec">Bölümüm</div><button class="ch" onclick="go(\'tanitim\')">🎯 Bölümünü seç (1 kez)</button>';
 if(rank(u)<=3)h+='<div class="sec">🛡️ Yönetim · Tüm Bölümler</div>'+JOBS.filter(j=>j[0]!=u.job).map(j=>`<details><summary>${j[2]} ${j[1]}</summary>${L.filter(c=>c.job==j[0]).map(btn).join('')}</details>`).join('');
 if(L.some(c=>c.les))h+='<div class="sec">🔴 Aktif Dersler</div>'+L.filter(c=>c.les).map(btn).join('');
 if(canCode(u)||isEgt(u)||isDen(u))h+='<div class="sec">Özel</div>'+L.filter(c=>c.id=='kod'||c.id=='dersver').map(btn).join('');
 $('nav').innerHTML=h;$('fb').style.display=DB.locked?'none':'';
 history.replaceState(null,'','#/c/'+CH);
 const c=L.find(c=>c.id==CH);if(!c)return go('pano');
 const pre=c.job?JOBS.find(j=>j[0]==c.job)[1]+' · ':'';
 $('ttl').textContent=c.i+' '+pre+c.n;$('view').innerHTML=view(c,u);afterView(c);
}

/* ====== GÖRÜNÜMLER ====== */
function msgHtml(m,del){const u=DB.users[uk(m.u)];return`<div class="msg"><div class="av">${esc(m.u[0].toUpperCase())}</div><div style="flex:1"><b>${esc(m.u)}</b>${u&&u.staff?`<span class="badge">${esc(u.staff)}</span>`:''}<small>${new Date(m.ts).toLocaleString('tr-TR',{dateStyle:'short',timeStyle:'short'})}</small>${del?` <button class="btn ghost sm" onclick="delMsg('${CH}',${m.ts})">✕</button>`:''}<div class="t">${esc(m.t)}</div></div></div>`}
function listHtml(c,u){const a=DB.msgs[c.id]||[];return a.length?a.map(m=>msgHtml(m,(c.t=='feed'&&isStaff(u))||rank(u)<=3)).join(''):'<div style="color:var(--mu);padding:20px;text-align:center">Henüz mesaj yok.</div>'}
function view0(c,u){
 switch(c.t){
 case'chat':case'feed':{
  const can=c.t=='chat'||isStaff(u);
  return`<div id="list">${listHtml(c,u)}</div>`+(can?`<div class="comp"><input id="mi" placeholder="${c.t=='feed'?'Yayınla…':'Mesaj yaz…'}" maxlength="1000" onkeydown="if(event.key=='Enter')send()"><button class="btn" onclick="send()">Gönder</button></div>`:'<div class="card" style="margin:12px 0 0;color:var(--mu)">🔒 Bu kanala sadece yetkililer yazabilir.</div>')+(c.id=='sohbet'?`<div style="color:var(--mu);font-size:12px;padding-top:6px">Sohbet her 50 mesajda sıfırlanır (${(DB.msgs.sohbet||[]).length}/50).</div>`:'');}
 case'intro':return`<div class="card tilt"><h3>Hoş geldin, ${esc(u.name)} 👋</h3><p style="color:var(--mu);margin-top:6px">HÜKÜM STUDİO; farklı iş kollarında çalışan ekibimizin buluşma noktası. Aşağıdan <b>kendi iş kolunu seç</b>; seçtiğin işe ait özel kanallar sol menüde açılır. <b>Bölüm seçimi sadece 1 kez yapılır</b>; sonradan değiştirmek için Baş Admin veya üstü bir yetkiliye başvurman gerekir.</p><p style="margin-top:8px">🏭 <b>Fabrika sistemi:</b> önce iş kolunun <b>Atölye</b> kanalında Stajyer olarak görevleri tamamla. 100 XP'ye ulaşıp Çırak olunca derslere katılabilirsin. XP kazandıkça otomatik terfi alırsın; en tepede Owner var.</p></div><div class="grid">${JOBS.map(j=>`<div class="card job tilt ${u.job==j[0]?'sel':''}" ${hasJob(u)&&rank(u)>3?'style="opacity:.55;cursor:not-allowed"':`onclick="pick('${j[0]}')"`}><div class="ic">${j[2]}</div><b>${j[1]}</b><div style="color:var(--mu);font-size:13px">${u.job==j[0]?'✔ Seçili':(hasJob(u)&&rank(u)>3?'🔒 Kilitli':'Seç')}</div></div>`).join('')}</div>`;
 case'staff':return staffV(u);
 case'done':return(isStaff(u)?`<div class="card"><b>Yeni paylaşım</b><div class="fld" style="margin-top:8px"><input type="file" id="dimg" accept="image/*"></div><div class="fld"><textarea id="dtx" placeholder="Bu ekran görüntüsü ne? Ne için alındı?"></textarea></div><button class="btn" onclick="addDone()">Paylaş</button></div>`:'<div class="card" style="color:var(--mu)">Bu kanalı sadece yetkililer doldurur.</div>')+DB.done.slice().reverse().map(x=>`<div class="card tilt"><b>${esc(x.u)}</b><small style="color:var(--mu)"> ${new Date(x.ts).toLocaleDateString('tr-TR')}</small>${isStaff(u)?` <button class="btn ghost sm" onclick="delDone(${x.ts})">✕</button>`:''}<div style="white-space:pre-wrap;margin-top:6px">${esc(x.d)}</div><img class="shot" src="${esc(x.img)}"></div>`).join('');
 case'about':return`<div class="card tilt" style="white-space:pre-wrap">${esc(DB.about)||'<span style="color:var(--mu)">Henüz doldurulmadı.</span>'}</div>`+(isStaff(u)?`<div class="card"><textarea id="ab" style="min-height:160px">${esc(DB.about)}</textarea><button class="btn" style="margin-top:8px" onclick="saveAbout()">Kaydet</button></div>`:'');
 case'social':return(DB.social.map((s,i)=>`<div class="card tilt row" style="justify-content:space-between"><div><b>${esc(s.n)}</b><br><a style="color:var(--c)" target="_blank" rel="noopener" href="${esc(/^https?:\/\//.test(s.u)?s.u:'#')}">${esc(s.u)}</a></div>${rank(u)<=1?`<button class="btn ghost sm" onclick="delSoc(${i})">✕</button>`:''}</div>`).join('')||'<div class="card" style="color:var(--mu)">Henüz hesap eklenmedi.</div>')+(rank(u)<=1?`<div class="card"><div class="fld"><input id="sn" placeholder="Ad (Instagram, YouTube…)"></div><div class="fld"><input id="su" placeholder="https://…"></div><button class="btn" onclick="addSoc()">Ekle</button></div>`:'');
 case'rules':return`<div class="card tilt"><ol style="padding-left:20px">${RULES.map(r=>`<li style="margin:8px 0">${r}</li>`).join('')}</ol></div>`;
 case'code':return codeView(u);case'sched':return schedV(u);case'info':return infoV(c,u);case'career':return careerV(u);case'home':return homeV(u);case'hub':return hubV(c,u);case'work':return workV(c,u);case'teach':return teachV(u);case'lab':return labV(c,u);case'ltest':return testV(c,u);
 }
}
function afterView(c){const l=$('list');if(l)l.scrollTop=l.scrollHeight;if(c.t=='teach')fillL()}

/* ====== İŞLEMLER ====== */
async function send(){const i=$('mi'),t=i.value.trim();if(!t)return;i.value='';
 await act(async()=>{await mut(d=>{const id=CH;let a=d.msgs[id]||[];if(id=='sohbet'&&a.length>=50)a=[{u:'Sistem',t:'♻️ Sohbet 50 mesaja ulaştığı için sıfırlandı.',ts:Date.now()-1}];a.push({u:me().name,t,ts:Date.now()});d.msgs[id]=a});draw()})}
const delMsg=(id,ts)=>act(async()=>{await mut(d=>{if(!isStaff(d.users[uk(ME.name)]))throw new Error('Yetkin yok');d.msgs[id]=(d.msgs[id]||[]).filter(m=>m.ts!=ts)});draw()});
const pick=j=>act(async()=>{if(!confirm('Bölümün: '+jobN(j)[1]+'\n\nBu seçim SADECE 1 KEZ yapılır. Sonradan yalnızca Baş Admin ve üstü değiştirebilir. Emin misin?'))return;await mut(d=>{const u=d.users[uk(ME.name)];if(hasJob(u)&&rank(u)>3)throw new Error('Bölümün zaten seçili. Değiştirmek için Baş Admin veya üstüne başvur.');u.job=j});toast('Bölüm seçildi ✔');CH=j+'-hub';draw()});
const setRole=(k,v)=>act(async()=>{await mut(d=>{const m=rank(d.users[uk(ME.name)]),t=d.users[k];if(m>1||rank(t)<=m)throw new Error('Yetkin yok');if(v&&RANKS.indexOf(v)<=m)throw new Error('Kendi rütbenden yüksek veremezsin');t.staff=v||null});draw()});
const setKod=(k,v)=>act(async()=>{await mut(d=>{if(rank(d.users[uk(ME.name)])>1)throw new Error('Yetkin yok');d.users[k].kod=v});draw()});const saveAbout=()=>act(async()=>{await mut(d=>{if(!isStaff(d.users[uk(ME.name)]))throw new Error('Yetkin yok');d.about=$('ab').value});toast('Kaydedildi ✔');draw()});
const addSoc=()=>act(async()=>{const n=$('sn').value.trim(),u=$('su').value.trim();if(!n||!/^https?:\/\//.test(u))throw new Error('Ad ve https:// ile başlayan link gir');await mut(d=>{if(rank(d.users[uk(ME.name)])>1)throw new Error('Sadece Owner ve üstü');d.social.push({n,u})});draw()});
const delSoc=i=>act(async()=>{await mut(d=>{d.social.splice(i,1)});draw()});
function shrink(f){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const s=Math.min(1,560/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.5))};im.onerror=()=>no(new Error('Görsel okunamadı'));im.src=URL.createObjectURL(f)})}
const addDone=()=>act(async()=>{const f=$('dimg').files[0],d=$('dtx').value.trim();if(!f||!d)throw new Error('Görsel ve açıklama zorunlu');const img=await shrink(f);if(img.length>45000)throw new Error('Görsel çok büyük, daha sade bir ekran görüntüsü seç');await mut(x=>{if(!isStaff(x.users[uk(ME.name)]))throw new Error('Yetkin yok');x.done.push({u:ME.name,d,img,ts:Date.now()})});draw()});
const delDone=ts=>act(async()=>{await mut(d=>{d.done=d.done.filter(x=>x.ts!=ts)});draw()});

/* ====== KOD DEPOSU ====== */
let OPEN=null;
function codeView(u){
 if(OPEN){const s=DB.snips.find(x=>x.id==OPEN);if(s){const link=location.origin+location.pathname+'#/k/'+s.id;return`<button class="btn ghost sm" onclick="OPEN=null;draw()">← Geri</button><div class="card" style="margin-top:10px"><b>${esc(s.t)}</b><small style="color:var(--mu)"> ${esc(s.u)} · ${new Date(s.ts).toLocaleDateString('tr-TR')}</small><pre id="cd">${esc(s.c)}</pre><div class="row" style="margin-top:10px"><button class="btn sm" onclick="cp(document.getElementById('cd').textContent)">Kodu Kopyala</button><button class="btn sm" onclick="cp('${link}')">🔗 Paylaşım Linki</button><button class="btn red sm" onclick="delSnip('${s.id}')">Sil</button></div><div style="color:var(--mu);font-size:12px;margin-top:8px;word-break:break-all">${link}</div></div>`}OPEN=null}
 return`<div class="card"><b>Yeni kod ekle</b><div class="fld" style="margin-top:8px"><input id="kt" placeholder="Başlık" maxlength="60"></div><div class="fld"><textarea id="kc" style="min-height:160px;font-family:monospace" placeholder="Kodu buraya yapıştır…"></textarea></div><button class="btn" onclick="addSnip()">Kaydet ve link oluştur</button></div>`+(DB.snips.slice().reverse().map(s=>`<div class="card tilt row" style="justify-content:space-between;cursor:pointer" onclick="OPEN='${s.id}';draw()"><div><b>💻 ${esc(s.t)}</b><br><small style="color:var(--mu)">${esc(s.u)} · ${s.c.length} karakter</small></div><span>›</span></div>`).join('')||'<div class="card" style="color:var(--mu)">Henüz kod yok.</div>')+`<div style="color:var(--mu);font-size:12px">Toplam veri limiti ~100KB'dır; çok uzun kodlar için sığmayabilir.</div>`;
}
const cp=t=>navigator.clipboard.writeText(t).then(()=>toast('Kopyalandı ✔'),()=>toast('Kopyalanamadı'));
const addSnip=()=>act(async()=>{const t=$('kt').value.trim(),c=$('kc').value;if(!t||!c.trim())throw new Error('Başlık ve kod gir');const id=Math.random().toString(36).slice(2,10);await mut(d=>{if(!canCode(d.users[uk(ME.name)]))throw new Error('Yetkin yok');d.snips.push({id,t,c,u:ME.name,ts:Date.now()})});OPEN=id;draw()});
const delSnip=id=>act(async()=>{if(!confirm('Silinsin mi?'))return;await mut(d=>{d.snips=d.snips.filter(x=>x.id!=id)});OPEN=null;draw()});

LABD.sqli={"n":"Giriş Formu Koruma Laboratuvarı (SQL Enjeksiyonu)","app":"Sanal uygulama: giriş formu, sorguyu metin birleştirerek kuruyor.","s":[["Kullanıcı adı alanına özel karakterler girildi, şifre kontrolü atlandı.","Kod sorguyu metin birleştirerek kuruyor. En doğru düzeltme?",["Parametreli sorgu (prepared statement) kullan","Sadece tırnak işaretlerini silmeye çalış","Giriş formunu gizle"],"Sorgu artık veriyi komuttan ayırıyor. Saldırı engellendi.","Girdiyi temizlemek yetmez; veri ile komutu ayırmak gerekir."],["Arama kutusundan başka tabloların bilgisi sızdı.","Zararı azaltmak için veritabanı kullanıcısına ne yaparsın?",["Sadece gereken yetkileri ver (en az yetki ilkesi)","Admin yetkisi ver","Tüm tabloları tek tabloya birleştir"],"Kullanıcı artık sadece ihtiyacı olan veriye erişiyor.","Yetki ne kadar azsa sızıntının zararı o kadar az olur."],["Hata sayfasında veritabanı hata detayları görünüyor.","Hata mesajı için doğru yaklaşım?",["Kullanıcıya genel mesaj göster, ayrıntıyı sunucu loguna yaz","Hata mesajını daha da detaylandır","Hataları herkese e-postayla gönder"],"İç yapı artık dışarıya sızmıyor.","Saldırgana ipucu veren detaylar kullanıcıya gösterilmez."],["Dakikada 400 giriş denemesi var.","Bunu nasıl yavaşlatırsın?",["Hız sınırı (rate limit) ve geçici kilit ekle","Deneme sayısını sınırsız bırak","Şifre alanını gizle"],"Aşırı denemeler artık otomatik engelleniyor.","Deneme sayısı sınırlanmazsa tahmin saldırıları kolaylaşır."]]};LABD.xss={"n":"Yorum Alanı Koruma Laboratuvarı (XSS)","app":"Sanal uygulama: yorum alanı kullanıcı girdisini olduğu gibi sayfaya basıyor.","s":[["Yorum alanına yerleştirilen kod, başka kullanıcıların sayfasında çalıştı.","Kullanıcı girdisini sayfada gösterirken ne yaparsın?",["Çıktıyı HTML olarak kodla (escape et)","Yorumu hiç kaydetme","Kullanıcılardan tarayıcı güncellemesini iste"],"Girdi artık düz metin olarak gösteriliyor.","Girdi, sayfaya basılırken kodlanmalıdır."],["Oturum çerezi okunmaya çalışıldı.","Oturum çerezi için hangi ayar doğru?",["HttpOnly ve Secure bayraklarını aç","Çerezi sayfada yazdır","Süresini sınırsız yap"],"Çerez artık sayfa kodlarından okunamıyor.","HttpOnly çerezi sayfa kodundan gizler."],["Dış kaynaktan izinsiz kod yüklenmeye çalışıldı.","Hangi güvenlik başlığı yardımcı olur?",["Content-Security-Policy","Content-Length","Accept-Language"],"Sadece izin verilen kaynaklar yükleniyor.","CSP, hangi kaynakların yüklenebileceğini belirler."]]};
LABD.brute={"n":"Giriş Güvenliği Laboratuvarı (Kaba Kuvvet)","app":"Sanal uygulama: giriş sayfası deneme sınırı olmadan çalışıyor.","s":[["Aynı adresten dakikada 300 şifre denemesi yapıldı.","Ne eklersin?",["Hız sınırı ve geçici kilit","Denemeleri sayma","Hata mesajını kısalt"],"Tekrarlı denemeler artık engelleniyor.","Deneme hızı sınırlanmalıdır."],["Veritabanı sızdı, şifreler düz metin olarak görünüyor.","Şifreleri nasıl saklamalıydın?",["bcrypt / argon2 ile tuzlu hash","Base64'e çevir","Başka tabloya taşı"],"Sızsa bile şifreler geri çözülemiyor.","Şifreler geri döndürülemeyen, tuzlu hash ile saklanır."],["Ele geçen şifreyle yabancı girişler oldu.","Hesapları nasıl korursun?",["İki adımlı doğrulama (2FA) zorunlu kıl","Minimum şifre uzunluğunu 4 yap","Giriş sayfasını sil"],"Şifre tek başına yetmiyor, ikinci doğrulama gerekiyor.","Tek faktörlü giriş yetersizdir."]]};
LABD.izin={"n":"Linux Yetki Laboratuvarı (Dosya İzinleri)","app":"Sanal sunucu: hassas dosyalar ve servis hesapları yanlış yetkilerle çalışıyor.","s":[["Herhangi bir kullanıcı, parolaların tutulduğu yapılandırma dosyasını okuyabiliyor.","Dosya izni için doğru ayar hangisi?",["Sadece sahibine okuma/yazma izni ver (örn. 600)","Herkese tam izin ver (777)","Dosyayı başka klasöre taşı ama izni değiştirme"],"Dosya artık sadece sahibi tarafından erişilebilir.","Hassas dosyalar en az izinle korunur."],["Web servisi root yetkisiyle çalışıyor; ele geçirilirse tüm sunucu risk altında.","Ne yapmalısın?",["Servisi yetkisiz, ayrı bir kullanıcıyla çalıştır","Servisi root ile çalıştırmaya devam et","Root şifresini kısalt"],"Ele geçirilse bile zarar sınırlı kalıyor.","En az yetki ilkesi: servis sadece ihtiyacı kadar yetkiye sahip olmalı."],["Ekipten ayrılan birinin hesabı hâlâ aktif.","Doğru hareket hangisi?",["Hesabı kapat, anahtar ve yetkilerini kaldır","Hesabı olduğu gibi bırak","Şifresini basit bir şey yap"],"Eski hesap artık erişim sağlayamıyor.","Kullanılmayan hesaplar hemen kapatılmalıdır."]]};
LABD.ssh={"n":"SSH Güvenlik Laboratuvarı","app":"Sanal sunucu: SSH servisi varsayılan ayarlarla internete açık.","s":[["SSH girişine şifreyle dakikada yüzlerce deneme geliyor.","En güçlü önlem hangisi?",["Şifreli girişi kapatıp anahtar (key) ile girişe geç","Şifreyi kısalt","Loglara bakma"],"Anahtarsız giriş artık mümkün değil.","Anahtar tabanlı doğrulama tahmin saldırılarını etkisizleştirir."],["Root hesabına doğrudan SSH girişi açık.","Ne yaparsın?",["Root girişini kapat, yetkili normal kullanıcıyla gir","Root girişini herkese aç","Root şifresini not defterine yaz"],"Doğrudan root girişi kapandı.","Doğrudan root girişi riskli; normal kullanıcı + sudo tercih edilir."],["SSH portu tüm internete açık.","Ek önlem nedir?",["Güvenlik duvarıyla sadece güvenilir adreslerden erişime izin ver","Güvenlik duvarını kapat","Portu açık bırak"],"Erişim artık sadece güvenilen adreslerden.","Erişimi sınırlamak saldırı yüzeyini küçültür."]]};
LABD.fw={"n":"Güvenlik Duvarı Laboratuvarı","app":"Sanal sunucu: pek çok port gereksiz yere dışarıya açık.","s":[["Kullanılmayan servislerin portları dışarıya açık.","Güvenlik duvarında temel kural nedir?",["Varsayılan olarak her şeyi engelle, sadece gereken portlara izin ver","Her şeye izin ver","Sadece loglamayı aç"],"Sadece gerekli portlar açık.","Varsayılan 'engelle' yaklaşımı en güvenlisidir."],["Veritabanı portu internete açık.","Ne yapmalısın?",["Veritabanına sadece yerel/özel ağdan erişim ver","Herkese açık bırak","Şifresini kısalt"],"Veritabanı artık dışarıdan görünmüyor.","Veritabanı genelde internete açılmaz."],["Kuralları uygularken kendi bağlantını da kestin.","Önlem nedir?",["Önce kendi erişimine izin ver, yedek erişim yolu hazırla","Kuralları rastgele uygula","Güvenlik duvarını hiç kullanma"],"Kendi erişimin güvende, kurallar yerinde.","Uzaktan yönetirken önce kendi erişimini garantiye al."]]};
LABD.ssl={"n":"HTTPS ve Sertifika Laboratuvarı","app":"Sanal site: HTTP üzerinden çalışıyor, sertifika sorunlu.","s":[["Site HTTP üzerinden çalışıyor, ağda giriş bilgileri okunabilir durumda.","Çözüm nedir?",["Geçerli bir SSL/TLS sertifikası kur ve HTTP'yi HTTPS'e yönlendir","Kullanıcılara dikkatli olmalarını söyle","Şifre alanını gizle"],"Bağlantı artık şifreli.","HTTPS trafiği şifreler."],["Sertifikanın süresi doldu, tarayıcılar uyarı veriyor.","Kalıcı çözüm nedir?",["Otomatik yenileme kur ve süreyi izle","Uyarıyı görmezden gel","Sertifikayı sil"],"Sertifika otomatik yenileniyor.","Otomasyon, unutulan yenilemeyi önler."],["Eski ve zayıf TLS sürümleri hâlâ açık.","Ne yaparsın?",["Eski sürümleri kapat, güncel sürümleri zorunlu kıl","Hepsini açık tut","Sunucuyu kapat"],"Sadece güncel ve güvenli sürümler çalışıyor.","Eski protokoller bilinen zayıflıklar taşır."]]};
LABD.yedek={"n":"Yedekleme ve Kurtarma Laboratuvarı","app":"Sanal sunucu: yedekleme düzeni zayıf.","s":[["Fidye yazılımı dosyaları şifreledi ve yedek yok.","Gelecekte ne yapmalısın?",["Düzenli, otomatik yedek al; kopyaları ayrı yerde sakla","Yedek alma","Yedeği aynı diske kopyala"],"Yedek planı hazır.","3-2-1 kuralı: 3 kopya, 2 farklı ortam, 1 tanesi dışarıda."],["Yedekler alındı ama hiç denenmedi, geri yükleme başarısız oldu.","Ne yapmalısın?",["Yedeği düzenli olarak geri yükleyip test et","Test etme, yedek yeterli","Yedek sayısını azalt"],"Yedeğin çalıştığı kanıtlandı.","Test edilmemiş yedek, yedek sayılmaz."],["Yedekler herkesin erişebildiği klasörde duruyor.","Doğrusu nedir?",["Yedekleri şifrele ve erişimi kısıtla","Herkese açık bırak","Sadece adını değiştir"],"Yedekler korunuyor.","Yedekler de hassas veridir."]]};
LABD.olay={"n":"Olay Müdahale Laboratuvarı","app":"Sanal sunucu: yetkisiz giriş izleri tespit edildi.","s":[["Sunucuda yetkisiz giriş izleri fark ettin.","İlk adım nedir?",["Etkilenen sistemi izole et, logları ve delilleri koru","Sunucuyu hemen sıfırla","Kimseye söyleme"],"Sistem izole edildi, deliller güvende.","Önce yayılmayı durdur, deliller silinmesin."],["Hangi hesapların etkilendiğini bilmiyorsun.","Sonraki adım nedir?",["Şifre ve anahtarları yenile, erişim loglarını incele","Hiçbir şeyi değiştirme","Sadece kendi şifreni değiştir"],"Erişimler yenilendi, kapsam netleşiyor.","Etkilenmiş olabilecek her erişim yenilenir."],["Olay kontrol altına alındı.","Son aşama nedir?",["Kök nedeni bul, açığı kapat, dersleri ekiple paylaş","Konuyu kapat, unut","Suçlu ara"],"Açık kapandı, ekip öğrendi.","Olay sonrası inceleme tekrarını önler."]]};
LABD.bot1={"sc":1,"n":"Bot Güvenliği Atölyesi (Moderasyon Botu)","app":"Sanal atölye: bir moderasyon botu yanlış ayarlarla çalışıyor.","s":[["Botun tokeni yanlışlıkla herkese açık bir depoya yüklendi.","Ne yaparsın?",["Tokeni hemen yenile (reset) ve ortam değişkeninde sakla","Depoyu sil, token aynı kalsın","Tokeni başka dosyaya taşı"],"Eski token geçersiz, yenisi güvende.","Sızan token hemen yenilenir; token koda yazılmaz."],["Her kullanıcı !ban komutunu kullanabiliyor.","Çözüm?",["Komutu sadece belirli rol ve izinlere kısıtla","Komutun adını değiştir","Botu kapat"],"Komut yalnızca yetkililere açık.","Yetki kontrolü komutun içinde yapılır."],["Bot gereksiz yere yönetici (admin) yetkisiyle eklenmiş.","Doğrusu hangisi?",["Sadece ihtiyaç duyduğu izinleri ver","Her zaman admin ver","Bota hiç izin verme"],"Bot minimum izinle çalışıyor.","En az yetki ilkesi botlar için de geçerlidir."]]};
LABD.bot2={"sc":1,"n":"Hata Ayıklama Atölyesi","app":"Sanal atölye: bot rastgele çöküyor ve loglar dağınık.","s":[["Bot rastgele çöküyor, nedenini bilmiyorsun.","İlk adım nedir?",["Hata mesajını ve logları oku, hatayı yeniden üret","Kodu baştan yaz","Botu yeniden başlatıp bırak"],"Hatanın yeri bulundu.","Önce hatayı anlamak gerekir."],["Loglarda kullanıcıların kişisel verileri görünüyor.","Doğrusu nedir?",["Hassas veriyi loglama veya maskele","Daha çok logla","Logları herkese aç"],"Loglar temiz ve güvenli.","Loglara token, şifre ve kişisel veri yazılmaz."],["Hata her gece oluşuyor ama kimse fark etmiyor.","Ne yaparsın?",["Hata uyarısı kur ve düzenli kontrol et","Hataları görmezden gel","Botu kapat"],"Hatalar anında haber veriyor.","İzleme ve uyarı sorunu erken yakalar."]]};
LABD.web1={"sc":1,"n":"Form Güvenliği Atölyesi","app":"Sanal atölye: bir iletişim formu zayıf doğrulamayla çalışıyor.","s":[["Formun e-posta alanına rastgele yazılar giriliyor.","Doğru yaklaşım nedir?",["Hem tarayıcıda hem sunucuda doğrulama yap","Sadece tarayıcıda doğrula","Doğrulama yapma"],"Veri iki yerde doğrulanıyor.","Tarayıcı doğrulaması kolay atlanır; sunucu doğrulaması şart."],["Aynı forma dakikada yüzlerce gönderim yapılıyor.","Çözüm nedir?",["Hız sınırı ve bot doğrulaması ekle","Formu kaldır","Hata mesajını sil"],"Spam azaldı.","Hız sınırı ve doğrulama spamı keser."],["Hatalı girişte tüm form temizleniyor, kullanıcılar sinirleniyor.","İyileştirme nedir?",["Girilen veriyi koru, hatayı alanın yanında göster","Her şeyi sil","Hatayı sayfa sonuna yaz"],"Kullanıcı deneyimi iyileşti.","İyi form net hata gösterir ve veriyi korur."]]};
LABD.web2={"sc":1,"n":"Performans Atölyesi","app":"Sanal atölye: ana sayfa çok yavaş açılıyor.","s":[["Ana sayfa 12 MB, telefonda çok yavaş açılıyor.","Önce ne yaparsın?",["Görselleri sıkıştır ve uygun boyutta kullan","Daha büyük görsel koy","Yazı boyutunu küçült"],"Sayfa boyutu düştü.","En büyük kazanç genelde görselleri optimize etmektir."],["Aynı dosyalar her ziyarette baştan indiriliyor.","Çözüm nedir?",["Önbellekleme (cache) ayarlarını yap","Önbelleği kapat","Dosyaları kopyala"],"Tekrar ziyaret çok hızlı.","Önbellek tekrar indirmeyi önler."],["Sayfada kullanılmayan büyük bir kütüphane yükleniyor.","Doğrusu nedir?",["Kullanılmayanı kaldır, gerekeni geç yükle","Hepsini yükle","Kütüphaneyi iki kez ekle"],"Gereksiz yük kalktı.","Sadece gereken kod yüklenir."]]};
LABD.saas1={"sc":1,"n":"Fikir Doğrulama Atölyesi","app":"Sanal atölye: bir SaaS fikri henüz doğrulanmadı.","s":[["Fikrin harika ama kimseye sormadın.","İlk adım nedir?",["Hedef kullanıcılarla konuşup sorunu doğrula","Hemen kodlamaya başla","Sadece arkadaşlarına sor"],"Sorunun gerçek olduğu doğrulandı.","Önce sorun doğrulanır, sonra çözüm."],["Kullanıcılar 'güzel fikir' diyor ama ödemeye yanaşmıyor.","Bu ne gösterir?",["İlgi var ama ödeme isteği kanıtlanmadı; ön sipariş veya bekleme listesi dene","Başardık","Fiyatı sıfırla"],"Gerçek talep ölçülüyor.","Beğenmek ile ödemek farklı şeylerdir."],["Tek bir kullanıcı özellik istedi ve tüm planı değiştirmek istiyorsun.","Doğrusu nedir?",["Tekrar eden ihtiyaçlara bak, tek isteğe göre yön değiştirme","Hemen uygula","Hepsini yok say"],"Karar veriye dayanıyor.","Tekrar eden geri bildirim daha güvenilirdir."]]};
LABD.saas2={"sc":1,"n":"Ödeme Güvenliği Atölyesi","app":"Sanal atölye: abonelik sistemi tasarlanıyor.","s":[["Kart bilgilerini kendi veritabanında saklamayı düşünüyorsun.","Doğrusu nedir?",["Kart verisini saklama, güvenilir ödeme sağlayıcısı kullan","Şifreli de olsa kendin sakla","Metin dosyasına yaz"],"Kart verisi sende durmuyor.","Kart verisi ödeme sağlayıcısında kalır."],["Aboneliği iptal etmek çok zor, kullanıcılar şikayetçi.","İyileştirme nedir?",["İptali kolay ve açık yap","İptal butonunu gizle","İptali kaldır"],"Kullanıcı güveni arttı.","Şeffaf iptal güven artırır."],["Ödeme başarısız olunca kullanıcı sessizce erişimini kaybediyor.","Doğrusu nedir?",["Bilgilendir, birkaç gün ek süre ver, tekrar dene","Hemen sil","Hiç haber verme"],"Kayıp kullanıcı azaldı.","Başarısız ödemede bildirim ve ek süre verilir."]]};LABD.icerik1={"sc":1,"n":"Başlık ve Kapak Atölyesi","app":"Sanal atölye: videoların az izleniyor.","s":[["Videoların izlenmiyor, başlıkların belirsiz.","Ne yaparsın?",["Net, merak uyandıran ve dürüst başlık yaz","Alakasız ama çarpıcı başlık yaz","Başlığı boş bırak"],"Tıklanma oranı artıyor.","Başlık dürüst ve net olmalı."],["Kapak görselindeki yazı telefonda okunmuyor.","Çözüm nedir?",["Az ve büyük yazı, yüksek kontrast kullan","Daha çok yazı ekle","Yazıyı küçült"],"Kapak telefonda net.","Kapak küçük ekranda okunur olmalı."],["Videoda anlatılmayan bir şeyi başlığa yazdın, izleyiciler terk ediyor.","Doğrusu nedir?",["Başlık içeriği doğru yansıtmalı","Yanıltıcı başlığı sürdür","Videoyu sil"],"İzleme süresi düzeldi.","Yanıltıcı başlık izleyiciyi kaybettirir."]]};
LABD.icerik2={"sc":1,"n":"Telif Atölyesi","app":"Sanal atölye: içerik üretirken telif sorunları var.","s":[["Videonda ticari bir şarkı kullanmak istiyorsun.","Doğrusu nedir?",["İzinli, lisanslı veya telifsiz müzik kullan","İzinsiz kullan","Sesi kısıp kullan"],"Müzik kullanımı güvenli.","Lisans ve izin olmadan müzik kullanılmaz."],["Bir görseli internetten bulup paylaşacaksın.","Doğrusu nedir?",["Lisansını kontrol et veya kendi görselini kullan","İlk bulduğunu al","Logosunu kes"],"Görsel kullanım hakkı net.","Her görselin lisansı kontrol edilir."],["Platform topluluk kurallarını ihlal edip uyarı aldın.","Ne yaparsın?",["Kuralı oku, içeriği düzelt, tekrar etme","Kuralı dinleme","Yeni hesap aç"],"Hesap güvende.","Kurallara uymak hesabını korur."]]};
LABD.topluluk1={"sc":1,"n":"Kriz Yönetimi Atölyesi","app":"Sanal atölye: sunucuda gerginlik yükseliyor.","s":[["Sunucuda bir tartışma büyüyor, herkes birbirine giriyor.","İlk adım nedir?",["Sakin kal, tartışmayı durdur, gerekirse kanalı kilitle","Sen de tartışmaya katıl","Görmezden gel"],"Ortam sakinleşti.","Önce ortam sakinleştirilir."],["Bir moderatörün adil olmadığı iddia ediliyor.","Doğrusu nedir?",["İddiayı tarafsız incele, ekip içinde karar ver, şeffaf bilgi ver","Moderatörü hemen savun","Konuyu gizle"],"Güven korundu.","Şeffaf ve adil süreç güven verir."],["Kriz bitti.","Son adım nedir?",["Ne olduğunu değerlendir, kuralları gerekirse güncelle","Her şey unutulsun","Suçlu ara"],"Topluluk bir sonraki krize hazır.","Kriz sonrası değerlendirme tekrarını önler."]]};
LABD.topluluk2={"sc":1,"n":"Spam ve Trol Atölyesi","app":"Sanal atölye: sunucuya spam ve trol geliyor.","s":[["Yeni üyeler toplu halde reklam mesajı atıyor.","Çözüm nedir?",["Yeni üyelere doğrulama ve kısıtlı izin ver","Her şeye izin ver","Sunucuyu kapat"],"Spam azaldı.","Yeni üyelere kademeli izin verilir."],["Bir kullanıcı sürekli kışkırtıcı mesajlar yazıyor.","Doğrusu nedir?",["Kurala göre uyar, tekrarında sustur veya uzaklaştır","Her mesajına cevap ver","Kanalı sil"],"Kural tutarlı uygulanıyor.","Kurallar herkese eşit uygulanır."],["Çok sayıda yeni hesap doğrulamasız giriyor.","Önlem nedir?",["Yeni hesap yaşı ve doğrulama filtresi ekle","Hiçbir şey yapma","Tüm davetleri sil"],"Sahte hesap girişi zorlaştı.","Doğrulama sahte hesapları azaltır."]]};
LABD.pazar1={"sc":1,"n":"Reklam Bütçesi Atölyesi","app":"Sanal atölye: reklam harcaması ölçülmüyor.","s":[["Reklama bütçe harcadın ama sonucu ölçmüyorsun.","Doğrusu nedir?",["Hedef belirle ve tıklama ile dönüşüm gibi metrikleri ölç","Daha çok harca","Ölçme, hissine güven"],"Harcama ölçülebilir.","Ölçülmeyen reklam geliştirilemez."],["Tüm bütçeyi tek bir reklama koydun.","Daha iyisi nedir?",["Küçük bütçeyle birkaç varyasyon dene, iyi olana ağırlık ver","Hepsini tek reklama koy","Reklam yapma"],"Risk dağıldı.","Önce küçük testler yapılır."],["Tıklama çok ama satış yok.","Neye bakmalısın?",["Açılış sayfası ve teklifi kontrol et","Reklamı büyüt","Ürünü bedava yap"],"Sorun açılış sayfasında bulundu.","Tıklama ile satış aynı şey değildir."]]};
LABD.pazar2={"sc":1,"n":"A/B Testi Atölyesi","app":"Sanal atölye: bir sayfa için A/B testi yapılıyor.","s":[["İki başlığı test ediyorsun ama aynı anda renk ve metni de değiştirdin.","Sorun nedir?",["Tek seferde tek değişken test edilmeli","Sorun yok","Daha çok değişken ekle"],"Sonuç net yorumlanabilir.","Tek değişkenle test yapılır."],["Testi 1 saat sonra bitirip kazananı seçtin.","Doğrusu nedir?",["Yeterli ziyaretçi ve süre bekle","Hemen karar ver","Hiç test etme"],"Karar güvenilir veriye dayanıyor.","Çok az veriyle alınan karar yanıltır."],["Kazanan versiyon belli oldu.","Sonraki adım nedir?",["Uygula ve yeni bir iyileştirme testi planla","Bir daha test etme","Eskisine dön"],"Sürekli gelişim döngüsü kuruldu.","Test sürekli yapılır."]]};
LABD.freelance1={"sc":1,"n":"Müşteri İletişimi Atölyesi","app":"Sanal atölye: zor bir müşteriyle proje yürütüyorsun.","s":[["Müşteri ne istediğini net söylemiyor.","Ne yaparsın?",["Sorular sorup yazılı kapsam belirle","Tahminle başla","İşi reddet"],"Kapsam netleşti.","Yazılı kapsam anlaşmazlığı önler."],["Müşteri sürekli ek iş istiyor, sınır yok.","Doğrusu nedir?",["Ek işi ayrı teklif ve fiyatla yap","Hepsini bedava yap","Müşteriyi engelle"],"Sınır korundu.","Kapsam dışı iş ek ücretlidir."],["Teslim tarihini kaçıracağını fark ettin.","Ne yaparsın?",["Müşteriyi erken bilgilendir, yeni plan sun","Hiç söyleme","Ortadan kaybol"],"Güven korundu.","Erken ve dürüst bilgi güven verir."]]};
LABD.freelance2={"sc":1,"n":"Sözleşme Atölyesi","app":"Sanal atölye: yeni bir iş için anlaşma yapılıyor.","s":[["Yazılı anlaşma olmadan işe başlamak üzeresin.","Doğrusu nedir?",["Kapsam, süre ve ücreti yazılı netleştir","Sözlü anlaşmaya güven","Ücreti sonra konuş"],"Anlaşma yazılı.","Her işte yazılı anlaşma olmalı."],["Müşteri ödemeyi iş bittikten sonra yapacağını söylüyor ve tanımıyorsun.","Önlem nedir?",["Avans veya aşamalı ödeme iste","Tüm işi ödemesiz bitir","Ücreti düşür"],"Risk azaldı.","Avans ve aşamalı ödeme riski azaltır."],["Müşteri revizyon sayısı konusunda anlaşmazlık çıkardı.","Çözüm nedir?",["Revizyon sayısını baştan sözleşmeye yaz","Sınırsız revizyon ver","İşi bırak"],"Revizyon sınırı net.","Revizyon hakkı baştan belirlenir."]]};
LABD.tasarim1={"sc":1,"n":"Renk ve Yazı Atölyesi","app":"Sanal atölye: bir afişin tasarımı dağınık görünüyor.","s":[["Tasarımda 8 farklı yazı tipi kullanılmış, dağınık görünüyor.","Düzeltme nedir?",["En fazla 2 yazı tipi kullan","Daha çok ekle","Hepsini büyüt"],"Tasarım tutarlı.","Az ve uyumlu yazı tipi tercih edilir."],["Koyu zeminde koyu gri yazı kullanılmış, okunmuyor.","Çözüm nedir?",["Yeterli kontrast sağla","Yazıyı küçült","Zemini bulanıklaştır"],"Metin okunur.","Kontrast okunabilirlik içindir."],["Renk paleti çok karışık.","Doğrusu nedir?",["Ana, ikincil ve vurgu renkleriyle sınırlı palet kur","Tüm renkleri kullan","Sadece gri kullan"],"Palet uyumlu.","Sınırlı palet tutarlılık sağlar."]]};
LABD.tasarim2={"sc":1,"n":"Tasarım Telif Atölyesi","app":"Sanal atölye: müşteri işi için görsel ve yazı tipi seçiliyor.","s":[["Müşteri tasarımı için internetten bulduğun bir fotoğrafı kullanmak istiyorsun.","Doğrusu nedir?",["Lisansı uygun veya telifsiz görsel kullan","İlk bulduğunu kullan","Kenarını kes"],"Görsel hakkı net.","Lisanslı veya telifsiz kaynak kullan."],["Ücretsiz bir yazı tipi buldun.","Ticari işte kullanmadan önce ne yaparsın?",["Lisansında ticari kullanıma izin verdiğini kontrol et","Hemen kullan","Adını değiştir"],"Yazı tipi lisansı uygun.","Ücretsiz her zaman ticari serbest demek değildir."],["Başka birinin logosuna çok benzeyen bir logo çizdin.","Ne yaparsın?",["Özgün ve ayırt edilebilir bir tasarım yap","Benzerliği sakla","Aynen bırak"],"Özgün tasarım.","Başkasının tasarımı kopyalanmaz."]]};
LABD.oyun1={"sc":1,"n":"Adil Oyun Atölyesi","app":"Sanal atölye: sunucuda hile ve yetki sorunları var.","s":[["Sunucuda hile kullandığı şüphelenilen oyuncular var.","Doğru yaklaşım nedir?",["Kanıt topla, kurala göre işlem yap","Herkesi cezalandır","Görmezden gel"],"Adil işlem yapıldı.","Kanıt olmadan ceza verilmez."],["Yetkililerden biri yetkisini kötüye kullanıyor.","Doğrusu nedir?",["Yetki kayıtlarını incele, gerekirse yetkisini al","Sessiz kal","Herkese yetki ver"],"Yetki düzeni korundu.","Yetki kullanımı kayıt altındadır."],["Oyuncular hileyi nasıl bildireceğini bilmiyor.","Çözüm nedir?",["Net bir bildirim kanalı ve süreç oluştur","Bildirimi yasakla","Kanalı sil"],"Bildirim süreci net.","Kolay bildirim yolu adaleti artırır."]]};
LABD.oyun2={"sc":1,"n":"Hakemlik Atölyesi","app":"Sanal atölye: bir turnuvada hakemlik yapıyorsun.","s":[["İki takım sonucu kabul etmiyor, itiraz ediyor.","Doğrusu nedir?",["Kanıtları incele, yazılı kurallara göre karar ver","Yazı tura at","En çok bağıran kazansın"],"Karar kurala dayanıyor.","Kurallar önceden yazılı olmalı."],["Bir takım maça geç kaldı.","Ne yaparsın?",["Önceden yazılan bekleme süresi kuralını uygula","Her takıma farklı kural uygula","Maçı iptal et"],"Kural eşit uygulandı.","Kural herkes için aynıdır."],["Hakem olarak arkadaşının takımı maçta.","Doğrusu nedir?",["Çıkar çatışmasını bildir ve başka hakem ata","Gizle","Tarafsız olduğunu söyle"],"Tarafsızlık korundu.","Çıkar çatışması bildirilir."]]};
LABD.egitim1={"sc":1,"n":"Test Hazırlama Atölyesi","app":"Sanal atölye: bir ders için test hazırlıyorsun.","s":[["Test sorularının hepsi ezber bilgi soruyor.","İyileştirme nedir?",["Anlamayı ölçen uygulama soruları ekle","Daha çok ezber sor","Soruları zorlaştır"],"Test anlamayı ölçüyor.","Test öğrenmeyi ölçmeli."],["Bir soruda iki doğru şık var.","Düzeltme nedir?",["Tek net doğru cevap olacak şekilde yeniden yaz","Öğrencilerin tahmin etmesine bırak","Soruyu bozuk bırak"],"Soru net.","Her sorunun tek doğrusu olmalı."],["Sonuçlar çok düşük çıktı.","Ne yaparsın?",["Soru ve ders anlatımını gözden geçir","Öğrencileri suçla","Testi yok say"],"Ders ve test iyileşiyor.","Düşük sonuç anlatımı da sorgulatır."]]};
LABD.egitim2={"sc":1,"n":"Geri Bildirim Atölyesi","app":"Sanal atölye: bir öğrencinin çalışmasına geri bildirim veriyorsun.","s":[["Öğrencinin çalışmasında hatalar var.","Nasıl geri bildirim verirsin?",["Önce iyi yanı, sonra net ve uygulanabilir öneri sun","Sadece hataları say","Hiçbir şey söyleme"],"Öğrenci motive ve yönlendirilmiş.","Geri bildirim yapıcı ve net olmalı."],["Öğrenci geri bildirime kızdı.","Doğrusu nedir?",["Dinle, amacını açıkla, tekrar yönlendir","Sen de kız","Konuyu kapat"],"İletişim sürdü.","Sakin ve açık iletişim kur."],["Aynı hatayı öğrenci tekrar yapıyor.","Ne yaparsın?",["Kök nedeni bul, örnekle yeniden anlat","Cezalandır","Geç"],"Öğrenme pekişiyor.","Tekrar eden hata anlatımı değiştirmeyi gerektirir."]]};
LABD.diger1={"sc":1,"n":"Fiyatlandırma Atölyesi","app":"Sanal atölye: bir dijital ürünün fiyatı belirleniyor.","s":[["Ürününü rakipten çok ucuza satıyorsun, kâr etmiyorsun.","Doğrusu nedir?",["Maliyeti ve değeri hesaplayıp fiyatı belirle","Daha da düşür","Fiyatı rastgele seç"],"Fiyat sürdürülebilir.","Fiyat maliyet ve değerle belirlenir."],["Tek fiyat var, bazı müşteriler pahalı buluyor.","İyileştirme nedir?",["Farklı paketler sun (temel, standart, gelişmiş)","Fiyatı kaldır","Herkese indirim yap"],"Farklı müşteriye uygun seçenek var.","Paketler seçenek sunar."],["Sürekli indirim yapıyorsun.","Sorun nedir?",["Sürekli indirim ürün değerini düşürür; sınırlı süreli yap","Sorun yok","Fiyatı sıfırla"],"İndirim stratejik.","İndirim bilinçli kullanılmalı."]]};
LABD.diger2={"sc":1,"n":"İade ve Güven Atölyesi","app":"Sanal atölye: bir dijital ürünün politikaları hazırlanıyor.","s":[["Müşteri ürünü beğenmeyip iade istiyor, politikan yok.","Doğrusu nedir?",["Açık ve yazılı iade politikası oluştur","Her seferinde farklı karar ver","İadeyi yasakla"],"İade süreci net.","Yazılı politika güven verir."],["Müşteri verileri güvenli saklanmıyor.","Ne yaparsın?",["Sadece gerekli veriyi topla, güvenli sakla","Tüm veriyi topla","Herkese aç"],"Veri korunuyor.","Veri minimizasyonu ve güvenlik."],["Müşteri şikayetine 1 haftadır cevap vermedin.","Doğrusu nedir?",["Hızlıca yanıt ver, çözüm süresi söyle","Cevap verme","Müşteriyi engelle"],"Müşteri güveni korunuyor.","Hızlı yanıt memnuniyet getirir."]]};

 +'<div class="sec">🏆 Bölüm Sıralaması</div><div class="card">'+(mem.slice(0,10).map((x,i)=>`<div style="margin:4px 0">${i+1}. ${esc(x.name)} · ${esc(rankT(x))} · ${x.xp||0} XP</div>`).join('')||'Henüz üye yok.')+'</div>'}
async function daily(){const u=me(),t=new Date().toISOString().slice(0,10);if(!u||u.dl==t)return;try{await mut(d=>{const x=d.users[uk(ME.name)];if(!x||x.dl==t)return;x.dl=t;addXp(d,ME.name,5)});toast('☀️ Günlük giriş: +5 XP');draw()}catch(e){}}
function bn(k){const u=me();if(k=='m'){$('side').classList.toggle('open');return}go(k=='p'?'pano':k=='d'?'dersler':k=='k'?'kariyer':(hasJob(u)?u.job+'-hub':'tanitim'))}
/* ====== KURUCU GİRİŞİ ====== */
const nz=s=>s.toLocaleLowerCase('tr').replace(/ı/g,'i').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i');
function founder(){
 if(!ME&&!localStorage.getItem('hs_me'))return $('aerr').textContent='Önce kayıt ol / giriş yap, sonra Kurucu Girişi yap.',$('aerr').style.display='block';
 if(DB&&DB.locked)return toast('Kurucu girişi kalıcı olarak kapandı.');
 const m=document.createElement('div');m.className='modal';
 m.innerHTML=`<div class="box"><div class="logo" style="font-size:22px">KURUCU DOĞRULAMA</div><div class="sub">© EYO PAŞA TARAFINDAN · 5 soru</div>${QS.map((q,i)=>`<div class="fld"><label style="font-size:13px;color:var(--mu)">${i+1}. ${q.q}</label><input class="fq" autocomplete="off"></div>`).join('')}<div class="row"><button class="btn" id="fv">Doğrula</button><button class="btn ghost" id="fx">Vazgeç</button></div></div>`;
 document.body.appendChild(m);$('fx').onclick=()=>m.remove();
 $('fv').onclick=()=>act(async()=>{
  const ins=[...m.querySelectorAll('.fq')].map(i=>nz(i.value));let ok=true;
  for(let i=0;i<5;i++){const tk=ins[i].split(/[^a-z0-9]+/).filter(Boolean);const cand=new Set([...tk,tk.join('')]);const hs=new Set(await Promise.all([...cand].map(x=>sha(SALT+':'+x).then(h=>h))));
   // özetler node ile SALT+':'+kelime şeklinde üretildi
   let n=0;QS[i].a.forEach(a=>{if(hs.has(a))n++});if(n<QS[i].m)ok=false}
  if(!ok)throw new Error('Yanlış cevap. Doğrulama başarısız.');
  const sess=JSON.parse(localStorage.getItem('hs_me'));
  await mut(d=>{if(d.locked)throw new Error('Kurucu girişi kapalı');const u=d.users[uk(sess.n)];if(!u||u.h!==sess.h)throw new Error('Oturum geçersiz');u.staff='Kurucu';d.locked=true});
  m.remove();toast('👑 Artık KURUCUSUN! Kurucu girişi kapandı.');if(!$('app').classList.contains('on')){ME={name:sess.n};enter()}else draw();
 });
}

async function viewer(id){
 $('welcome').style.display='none';$('app').classList.add('on');$('side').style.display='none';$('burger').style.display='none';
 try{DB=await load();const s=DB.snips.find(x=>x.id==id);if(!s)throw new Error('Kod bulunamadı veya silinmiş.');
  $('ttl').textContent='💻 '+s.t;$('view').innerHTML=`<div class="card"><small style="color:var(--mu)">${esc(s.u)} tarafından · HÜKÜM STUDİO Kod Deposu</small><pre id="cd">${esc(s.c)}</pre><button class="btn sm" style="margin-top:10px" onclick="cp(document.getElementById('cd').textContent)">Kodu Kopyala</button></div>`}
 catch(e){$('ttl').textContent='Hata';$('view').innerHTML=`<div class="err" style="display:block">${esc(e.message)}</div>`}
}

document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('.tilt');document.querySelectorAll('.tilt').forEach(x=>{if(x!==t)x.style.transform=''});if(!t)return;const r=t.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;t.style.transform=`perspective(700px) rotateY(${px*12}deg) rotateX(${-py*12}deg) translateZ(8px)`});
document.addEventListener('mouseleave',()=>document.querySelectorAll('.tilt').forEach(x=>x.style.transform=''));
(function(){const c=$('spark'),x=c.getContext('2d');let w,h,P=[];const rs=()=>{w=c.width=innerWidth;h=c.height=innerHeight};rs();addEventListener('resize',rs);
 const mk=()=>({x:Math.random()*w,y:h+10,v:.5+Math.random()*2,r:.5+Math.random()*2,a:Math.random()*6,c:Math.random()<.5?'139,92,246':'34,211,238'});
 for(let i=0;i<70;i++){const p=mk();p.y=Math.random()*h;P.push(p)}
 (function f(){if($('welcome').style.display=='none')return;x.clearRect(0,0,w,h);P.forEach((p,i)=>{p.y-=p.v;p.a+=.03;p.x+=Math.sin(p.a)*.6;if(p.y<-10)P[i]=mk();x.beginPath();x.fillStyle=`rgba(${p.c},${.3+Math.abs(Math.sin(p.a))*.6})`;x.shadowBlur=12;x.shadowColor=`rgb(${p.c})`;x.arc(p.x,p.y,p.r,0,7);x.fill()});requestAnimationFrame(f)})()})();
$('uc').addEventListener('keydown',e=>{if(e.key=='Enter')auth()});
