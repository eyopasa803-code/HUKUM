<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HÜKÜM STUDİO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121014; --panel:#1b181d; --panel2:#221e24; --border:#332c2f;
    --gold:#c9a227; --red:#8a2424; --text:#ece6de; --dim:#a79c8e;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
  h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:700;margin:0 0 .4em;}
  a{color:var(--gold);}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:6px;padding:.6em 1.1em;
    background:var(--gold);color:#1a1510;font-weight:600;}
  button.ghost{background:transparent;color:var(--text);border:1px solid var(--border);}
  button.danger{background:var(--red);color:#fff;}
  input,textarea{font-family:inherit;background:var(--panel2);border:1px solid var(--border);
    color:var(--text);border-radius:6px;padding:.6em .8em;width:100%;}
  textarea{resize:vertical;min-height:80px;}
  .center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:28px;max-width:380px;width:100%;}
  .seal{text-align:center;color:var(--gold);letter-spacing:.08em;font-size:.75em;margin-bottom:6px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:.85em;color:var(--dim);margin-bottom:5px;}
  .err{color:#e06060;font-size:.85em;margin-top:8px;}
  .tabs{display:flex;gap:8px;margin-bottom:18px;}
  .tabs button{flex:1;background:var(--panel2);color:var(--dim);}
  .tabs button.active{background:var(--gold);color:#1a1510;}

  .app{display:flex;min-height:100vh;}
  .sidebar{width:250px;background:var(--panel);border-right:1px solid var(--border);
    padding:18px 0;flex-shrink:0;overflow-y:auto;}
  .brand{padding:0 18px 16px;border-bottom:1px solid var(--border);margin-bottom:12px;}
  .brand h1{font-size:1.5em;color:var(--gold);}
  .brand small{color:var(--dim);}
  .grp-title{font-size:.72em;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
    padding:10px 18px 4px;}
  .chan{display:block;width:100%;text-align:left;background:none;color:var(--text);
    border-radius:0;padding:7px 18px;font-weight:400;font-size:.95em;}
  .chan:hover{background:var(--panel2);}
  .chan.active{background:var(--panel2);border-left:3px solid var(--gold);color:var(--gold);}
  .userbox{margin-top:auto;padding:14px 18px;border-top:1px solid var(--border);font-size:.85em;}
  .userbox .ad{color:var(--gold);font-weight:600;}
  .userbox .rol{color:var(--dim);}

  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{padding:16px 24px;border-bottom:1px solid var(--border);background:var(--panel);}
  .content{flex:1;padding:24px;max-width:760px;width:100%;margin:0 auto;overflow-y:auto;}
  .msg{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:10px;}
  .msg .meta{font-size:.78em;color:var(--dim);margin-bottom:4px;}
  .msg .meta b{color:var(--gold);}
  .composer{display:flex;gap:10px;margin-top:16px;}
  .composer textarea{flex:1;}
  .locked{color:var(--dim);font-style:italic;padding:20px;text-align:center;}

  .is-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .is-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;}
  .is-card h3{font-size:1.1em;}
  .is-card p{font-size:.85em;color:var(--dim);margin:6px 0 10px;}
  .is-card button{width:100%;}
  .is-card.joined{border-color:var(--gold);}

  .soru{margin-bottom:12px;}
  .kutu{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:20px;}
  .kutu h2{color:var(--gold);}

  @media(max-width:760px){
    .app{flex-direction:column;}
    .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--border);max-height:220px;}
    .is-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ============================================================
   0) JSONBIN AYARLARI
   ============================================================ */
const JSONBIN_ID = "6ab4ff86ffd5d160532a06e6";
const JSONBIN_KEY = "$2a$10$KZk6tJKQc1ZgnkKrdRU80ex6YHybL2EZXS1C8.7MMLOJKVHtutajK";
const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_ID}`;

async function veriOku(){
  const r = await fetch(JSONBIN_URL + "/latest", {headers:{"X-Master-Key":JSONBIN_KEY}});
  const j = await r.json();
  return j.record;
}
async function veriYaz(veri){
  await fetch(JSONBIN_URL, {
    method:"PUT",
    headers:{"Content-Type":"application/json","X-Master-Key":JSONBIN_KEY},
    body:JSON.stringify(veri)
  });
}
function bosVeri(){
  return {
    kurucuTamamlandi:false,
    kullanicilar:{},
    mesajlar:{},
    kodlar:[]
  };
}

/* ============================================================
   1) İŞ KOLLARI
   ============================================================ */
const TAKIMLAR = {
  bot_yazilim:{isim:"Bot & Yazılım Geliştirme",aciklama:"Discord/Telegram botu, otomasyon scriptleri, eklenti geliştirme."},
  web_app:{isim:"Web & Uygulama Geliştirme",aciklama:"Kurumsal site, e-ticaret kurulumu, mobil uygulama, API entegrasyonu."},
  altyapi:{isim:"Sunucu & Altyapı Yönetimi",aciklama:"VPS kurulumu, oyun sunucusu hostlama, güvenlik taraması ve bakım."},
  saas_urun:{isim:"Ürün & SaaS Geliştirme",aciklama:"SaaS araçları, UI/UX şablonları, stok kod satışı."},
  icerik:{isim:"İçerik Üretimi",aciklama:"YouTube, Twitch, TikTok/Instagram içerikleri, podcast, blog."},
  topluluk:{isim:"Topluluk & Platform Yönetimi",aciklama:"Topluluk yönetimi, üyelik sistemleri, dışarıya topluluk hizmeti."},
  pazarlama:{isim:"Pazarlama & Affiliate",aciklama:"Affiliate pazarlama, bayilik komisyonu, reklam/sponsorluk."},
  freelance:{isim:"Freelance Hizmetler",aciklama:"Kodlama, çeviri, veri girişi, sanal asistanlık."},
  tasarim:{isim:"Tasarım & Medya",aciklama:"Grafik tasarım, video editörlüğü, ses/müzik prodüksiyonu."},
  oyun:{isim:"Oyun & Esports",aciklama:"Oyun sunucusu işletmeciliği, esports turnuva organizasyonu."},
  danismanlik:{isim:"Danışmanlık & Eğitim",aciklama:"1:1 mentorluk, kurumsal teknik eğitim, dokümantasyon."},
  dijital_urun:{isim:"Diğer Dijital Ürünler",aciklama:"Print-on-demand, teknik destek/bakım aboneliği."},
};

const YETKILI_ROLLERI = ["Kurucu","Owner","Co Owner","Baş Admin","Kıdemli Admin","Admin Denetmeni","Admin","Stajyer Admin"];

const GENEL_KANALLAR = [
  {id:"duyurular",ad:"Duyurular",sadeceYetkiliYazar:true},
  {id:"sohbet",ad:"Sohbet",limit:50},
  {id:"tanitim",ad:"Tanıtım",ozel:"tanitim"},
  {id:"yetkili-kadromuz",ad:"Yetkili Kadromuz",sadeceYetkiliYazar:true},
  {id:"yaptiklarimiz",ad:"Yaptıklarımız",sadeceYetkiliYazar:true,ssNotu:true},
  {id:"hakkimizda",ad:"Hakkımızda",sadeceYetkiliYazar:true},
  {id:"sosyal-medya",ad:"Sosyal Medya",sadeceUstYazar:true},
  {id:"kurallar",ad:"Kurallar",readOnly:true},
  {id:"kurucu-girisi",ad:"Kurucu Girişi",ozel:"kurucu"},
  {id:"kod-deposu",ad:"Kod Deposu",ozel:"kod",sadeceYetkiliGorur:true},
];

const KURALLAR_METNI = [
  "1. Herkese saygılı ol, hakaret ve ayrımcılık yasaktır.",
  "2. Spam, flood ve alakasız reklam yasaktır.",
  "3. Kanalları amacı dışında kullanma.",
  "4. Yetkililerin kararlarına saygı göster, itirazını doğru kanaldan ilet.",
  "5. Başka üyenin kişisel bilgisini izinsiz paylaşma.",
  "6. Yasa dışı veya zararlı içerik paylaşımı kesinlikle yasaktır.",
].join("\n");

/* ============================================================
   2) DURUM (STATE)
   ============================================================ */
let VERI = null;
let AKTIF_KULLANICI = localStorage.getItem("hs_kullanici") || null;
let AKTIF_KANAL = "tanitim";

function ben(){ return VERI.kullanicilar[AKTIF_KULLANICI]; }
function yetkiliMi(u){ return !!(u && u.yetkiRolu); }
function ustYetkiliMi(u){ return !!(u && ["Kurucu","Owner","Co Owner"].includes(u.yetkiRolu)); }

/* ============================================================
   3) BAŞLANGIÇ
   ============================================================ */
async function basla(){
  const root = document.getElementById("root");
  root.innerHTML = `<div class="center-screen"><div class="card"><div class="seal">HÜKÜM STUDİO</div>
    <h2 style="text-align:center">Yükleniyor...</h2></div></div>`;
  VERI = await veriOku();
  if(!VERI || typeof VERI !== "object" || Array.isArray(VERI)){ VERI = bosVeri(); await veriYaz(VERI); }
  if(AKTIF_KULLANICI && VERI.kullanicilar[AKTIF_KULLANICI]){
    cizUygulama();
  } else {
    AKTIF_KULLANICI = null;
    cizGiris();
  }
}

/* ============================================================
   4) GİRİŞ / KAYIT EKRANI
   ============================================================ */
function cizGiris(sekme="giris", hata=""){
  const root = document.getElementById("root");
  root.innerHTML = `
  <div class="center-screen">
    <div class="card">
      <div class="seal">© HÜKÜM STUDİO</div>
      <h2 style="text-align:center">Ekip Girişi</h2>
      <div class="tabs">
        <button id="tabGiris" class="${sekme==='giris'?'active':''}">Giriş Yap</button>
        <button id="tabKayit" class="${sekme==='kayit'?'active':''}">Kayıt Ol</button>
      </div>
      <div class="field"><label>Kullanıcı adı</label><input id="kadi" autocomplete="off"></div>
      <div class="field"><label>Giriş kodu (gerçek şifre KULLANMA, basit bir kod yeter)</label><input id="kkod" type="password"></div>
      ${sekme==='kayit' ? '<div class="field"><label>Görünen ad</label><input id="gad"></div>' : ''}
      <button id="gonderBtn" style="width:100%">${sekme==='giris'?'Giriş Yap':'Kayıt Ol'}</button>
      ${hata ? `<div class="err">${hata}</div>` : ''}
    </div>
  </div>`;
  document.getElementById("tabGiris").onclick=()=>cizGiris("giris");
  document.getElementById("tabKayit").onclick=()=>cizGiris("kayit");
  document.getElementById("gonderBtn").onclick=()=> sekme==='giris' ? girisYap() : kayitOl();
}

async function kayitOl(){
  const kadi = document.getElementById("kadi").value.trim().toLowerCase();
  const kkod = document.getElementById("kkod").value;
  const gad = document.getElementById("gad").value.trim() || kadi;
  if(!kadi || !kkod) return cizGiris("kayit","Kullanıcı adı ve kod gerekli.");
  VERI = await veriOku();
  if(VERI.kullanicilar[kadi]) return cizGiris("kayit","Bu kullanıcı adı zaten alınmış.");
  VERI.kullanicilar[kadi] = {ad:gad, kod:kkod, roller:[], yetkiRolu:null};
  await veriYaz(VERI);
  AKTIF_KULLANICI = kadi;
  localStorage.setItem("hs_kullanici", kadi);
  cizUygulama();
}

async function girisYap(){
  const kadi = document.getElementById("kadi").value.trim().toLowerCase();
  const kkod = document.getElementById("kkod").value;
  VERI = await veriOku();
  const u = VERI.kullanicilar[kadi];
  if(!u || u.kod !== kkod) return cizGiris("giris","Kullanıcı adı veya kod yanlış.");
  AKTIF_KULLANICI = kadi;
  localStorage.setItem("hs_kullanici", kadi);
  cizUygulama();
}

function cikisYap(){
  AKTIF_KULLANICI = null;
  localStorage.removeItem("hs_kullanici");
  cizGiris();
}

/* ============================================================
   5) ANA UYGULAMA İSKELETİ
   ============================================================ */
function kanalListesiIcinIsRolleri(u){
  return Object.keys(TAKIMLAR).filter(k => u.roller.includes(k) || yetkiliMi(u));
}

function cizUygulama(){
  const u = ben();
  const root = document.getElementById("root");

  let genelHtml = GENEL_KANALLAR.map(k=>{
    if(k.id==="kod-deposu" && !yetkiliMi(u)) return "";
    return `<button class="chan ${AKTIF_KANAL===k.id?'active':''}" data-kanal="${k.id}">${k.ad}</button>`;
  }).join("");

  let isRolleriHtml = kanalListesiIcinIsRolleri(u).map(key=>{
    const t = TAKIMLAR[key];
    const altlar = [["genel","Genel"],["gorevler","Görevler"],["duyurular","Duyurular"]];
    return `<div class="grp-title">${t.isim}</div>` + altlar.map(([s,ad])=>{
      const kid = key+"_"+s;
      return `<button class="chan ${AKTIF_KANAL===kid?'active':''}" data-kanal="${kid}">${ad}</button>`;
    }).join("");
  }).join("");

  root.innerHTML = `
  <div class="app">
    <div class="sidebar" style="display:flex;flex-direction:column;">
      <div class="brand"><h1>HÜKÜM<br>STUDİO</h1><small>${u.yetkiRolu || "Üye"}</small></div>
      <div class="grp-title">Genel</div>
      ${genelHtml}
      ${isRolleriHtml}
      <div class="userbox">
        <div class="ad">${u.ad}</div>
        <div class="rol">${u.yetkiRolu || "Henüz yetkisiz"}</div>
        <button class="ghost" style="margin-top:8px;width:100%" id="cikisBtn">Çıkış Yap</button>
      </div>
    </div>
    <div class="main">
      <div class="topbar"><h2 id="kanalBaslik" style="margin:0"></h2></div>
      <div class="content" id="icerik"></div>
    </div>
  </div>`;

  document.querySelectorAll(".chan").forEach(b=>{
    b.onclick = ()=>{ AKTIF_KANAL = b.dataset.kanal; cizUygulama(); };
  });
  document.getElementById("cikisBtn").onclick = cikisYap;

  cizKanalIcerik();
}

/* ============================================================
   6) KANAL İÇERİĞİ YÖNLENDİRME
   ============================================================ */
function cizKanalIcerik(){
  const icerik = document.getElementById("icerik");
  const baslikEl = document.getElementById("kanalBaslik");
  const u = ben();

  if(AKTIF_KANAL === "tanitim"){ baslikEl.textContent="Tanıtım"; return cizTanitim(icerik,u); }
  if(AKTIF_KANAL === "kurucu-girisi"){ baslikEl.textContent="Kurucu Girişi"; return cizKurucuGirisi(icerik,u); }
  if(AKTIF_KANAL === "kod-deposu"){ baslikEl.textContent="Kod Deposu"; return cizKodDeposu(icerik,u); }
  if(AKTIF_KANAL === "kurallar"){ baslikEl.textContent="Kurallar"; return cizKurallar(icerik); }

  const genelTanim = GENEL_KANALLAR.find(k=>k.id===AKTIF_KANAL);
  let ad = AKTIF_KANAL, yazabilir = true, ssNotu=false, limit=null;
  if(genelTanim){
    ad = genelTanim.ad;
    ssNotu = !!genelTanim.ssNotu;
    limit = genelTanim.limit || null;
    yazabilir = genelTanim.readOnly ? false
      : genelTanim.sadeceUstYazar ? ustYetkiliMi(u)
      : genelTanim.sadeceYetkiliYazar ? yetkiliMi(u)
      : true;
  } else {
    const [takimKey, altKanal] = AKTIF_KANAL.split("_");
    const t = TAKIMLAR[takimKey];
    ad = t ? `${t.isim} / ${altKanal}` : AKTIF_KANAL;
    yazabilir = altKanal === "duyurular" ? yetkiliMi(u) : true;
  }
  baslikEl.textContent = ad;
  cizMesajKanali(icerik, AKTIF_KANAL, yazabilir, ssNotu, limit);
}

/* ============================================================
   7) MESAJ KANALI (genel sohbet tipi kanallar)
   ============================================================ */
function cizMesajKanali(icerik, kanalId, yazabilir, ssNotu, limit){
  const liste = VERI.mesajlar[kanalId] || [];
  icerik.innerHTML = `
    <div id="mesajListe">${liste.map(mesajHtml).join("") || '<div class="locked">Henüz mesaj yok.</div>'}</div>
    ${yazabilir ? `
      ${ssNotu ? '<p style="color:var(--dim);font-size:.85em">Buraya sadece ekran görüntüsü açıklaması ve ne için olduğunu yaz.</p>' : ''}
      <div class="composer">
        <textarea id="yeniMesaj" placeholder="Mesajını yaz..."></textarea>
        <button id="gonderMesaj">Gönder</button>
      </div>` : `<div class="locked">Bu kanala sadece yetkililer yazabilir.</div>`}
  `;
  if(yazabilir){
    document.getElementById("gonderMesaj").onclick = ()=> mesajGonder(kanalId, limit);
  }
}

function mesajHtml(m){
  return `<div class="msg"><div class="meta"><b>${m.yazan}</b> — ${m.tarih}</div>${escapeHtml(m.metin)}</div>`;
}
function escapeHtml(s){
  return (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

async function mesajGonder(kanalId, limit){
  const alan = document.getElementById("yeniMesaj");
  const metin = alan.value.trim();
  if(!metin) return;
  const u = ben();
  VERI = await veriOku();
  if(!VERI.mesajlar[kanalId]) VERI.mesajlar[kanalId] = [];
  VERI.mesajlar[kanalId].push({yazan:u.ad, metin, tarih:new Date().toLocaleString("tr-TR")});
  if(limit && VERI.mesajlar[kanalId].length >= limit){
    VERI.mesajlar[kanalId] = [{yazan:"Sistem", metin:`🔄 ${limit} mesaja ulaşıldı, kanal sıfırlandı.`, tarih:new Date().toLocaleString("tr-TR")}];
  }
  await veriYaz(VERI);
  cizKanalIcerik();
}

/* ============================================================
   8) KURALLAR
   ============================================================ */
function cizKurallar(icerik){
  icerik.innerHTML = `<div class="kutu"><h2>📜 HÜKÜM STUDİO Kuralları</h2>
    <pre style="white-space:pre-wrap;font-family:inherit;line-height:1.7">${KURALLAR_METNI}</pre></div>`;
}

/* ============================================================
   9) TANITIM — iş kolu seçimi
   ============================================================ */
function cizTanitim(icerik,u){
  icerik.innerHTML = `
    <div class="kutu" style="margin-bottom:18px">
      <h2>İş Kollarımız</h2>
      <p style="color:var(--dim)">Sana uygun olan(lar)a tıkla, ilgili kanallar açılsın. Ayrılmak için tekrar tıkla.</p>
    </div>
    <div class="is-grid">
      ${Object.entries(TAKIMLAR).map(([key,t])=>{
        const katildi = u.roller.includes(key);
        return `<div class="is-card ${katildi?'joined':''}">
          <h3>${t.isim}</h3><p>${t.aciklama}</p>
          <button data-key="${key}" class="${katildi?'ghost':''}">${katildi?'Ayrıl':'Katıl'}</button>
        </div>`;
      }).join("")}
    </div>`;
  icerik.querySelectorAll("button[data-key]").forEach(b=>{
    b.onclick = async ()=>{
      const key = b.dataset.key;
      VERI = await veriOku();
      const uu = VERI.kullanicilar[AKTIF_KULLANICI];
      if(uu.roller.includes(key)) uu.roller = uu.roller.filter(r=>r!==key);
      else uu.roller.push(key);
      await veriYaz(VERI);
      cizUygulama();
    };
  });
}

/* ============================================================
   10) KURUCU GİRİŞİ — tek seferlik gizli doğrulama
   ============================================================ */
function normalize(s){ return (s||"").trim().toLocaleLowerCase("tr-TR"); }
function icerirMi(cevap, ...anahtarlar){ const n = normalize(cevap); return anahtarlar.every(a=>n.includes(a)); }

function cizKurucuGirisi(icerik,u){
  if(VERI.kurucuTamamlandi){
    icerik.innerHTML = `<div class="locked">🔒 Bu giriş zaten tamamlandı ve kalıcı olarak kapatıldı.</div>`;
    return;
  }
  icerik.innerHTML = `
    <div class="kutu">
      <h2>👑 Kurucu Girişi</h2>
      <p style="color:var(--dim)">© EYO PAŞA TARAFINDAN — 5 soruyu doğru cevaplarsan Kurucu rolü otomatik verilir. Bu giriş tek seferliktir.</p>
      <div class="soru"><label>1) EYO PAŞA'nın isim soyismi nedir?</label><input id="s1"></div>
      <div class="soru"><label>2) Eyo Paşa kaç yıldır sanalcıdır?</label><input id="s2"></div>
      <div class="soru"><label>3) Projelerinin başında neden "Hüküm" yazar?</label><textarea id="s3"></textarea></div>
      <div class="soru"><label>4) Eyo Paşa'nın ilk projesi nedir?</label><input id="s4"></div>
      <div class="soru"><label>5) Eyo Paşa'nın en sevdiği şey nedir?</label><input id="s5"></div>
      <button id="kontrolBtn">Gönder</button>
      <div class="err" id="kgHata"></div>
    </div>`;
  document.getElementById("kontrolBtn").onclick = async ()=>{
    const v1=document.getElementById("s1").value, v2=document.getElementById("s2").value,
          v3=document.getElementById("s3").value, v4=document.getElementById("s4").value,
          v5=document.getElementById("s5").value;
    const dogru =
      icerirMi(v1,"enver","eymen","öztürk") &&
      icerirMi(v2,"6") &&
      icerirMi(v3,"güç","otorite") && (icerirMi(v3,"yerli")||icerirMi(v3,"milli")) &&
      icerirMi(v4,"hükümv45") &&
      icerirMi(v5,"dostluk") && icerirMi(v5,"ekip");
    if(!dogru){ document.getElementById("kgHata").textContent = "❌ Cevaplardan en az biri yanlış."; return; }
    VERI = await veriOku();
    if(VERI.kurucuTamamlandi){ cizKurucuGirisi(icerik, u); return; }
    VERI.kullanicilar[AKTIF_KULLANICI].yetkiRolu = "Kurucu";
    VERI.kurucuTamamlandi = true;
    await veriYaz(VERI);
    cizUygulama();
  };
}

/* ============================================================
   11) KOD DEPOSU
   ============================================================ */
function rastgeleId(){ return Math.random().toString(36).slice(2,9); }

function cizKodDeposu(icerik,u){
  if(!yetkiliMi(u)){ icerik.innerHTML = `<div class="locked">Bu kanal sadece yetkililere açıktır.</div>`; return; }
  const kodlar = VERI.kodlar || [];
  icerik.innerHTML = `
    <div class="kutu" style="margin-bottom:18px">
      <h2>💾 Yeni Kod Ekle</h2>
      <div class="field"><label>Başlık</label><input id="kBaslik"></div>
      <div class="field"><label>Kod</label><textarea id="kKod" style="min-height:160px;font-family:monospace"></textarea></div>
      <button id="kodEkleBtn">Kaydet ve Link Üret</button>
    </div>
    <h3>Paylaşılan Kodlar</h3>
    <div id="kodListe">${kodlar.slice().reverse().map(kodKartiHtml).join("") || '<div class="locked">Henüz kod yok.</div>'}</div>
  `;
  document.getElementById("kodEkleBtn").onclick = async ()=>{
    const baslik = document.getElementById("kBaslik").value.trim() || "İsimsiz";
    const kod = document.getElementById("kKod").value;
    if(!kod.trim()) return;
    const id = rastgeleId();
    VERI = await veriOku();
    if(!VERI.kodlar) VERI.kodlar = [];
    VERI.kodlar.push({id, baslik, kod, yazan:u.ad, tarih:new Date().toLocaleString("tr-TR")});
    await veriYaz(VERI);
    cizKanalIcerik();
  };
  icerik.querySelectorAll("button[data-link]").forEach(b=>{
    b.onclick = ()=>{
      const link = location.origin + location.pathname + "?kod=" + b.dataset.link;
      navigator.clipboard.writeText(link);
      b.textContent = "Kopyalandı ✓";
      setTimeout(()=> b.textContent = "Linki Kopyala", 1500);
    };
  });
}

function kodKartiHtml(k){
  return `<div class="msg">
    <div class="meta"><b>${k.baslik}</b> — ${k.yazan}, ${k.tarih}</div>
    <button data-link="${k.id}" class="ghost">Linki Kopyala</button>
  </div>`;
}

/* ============================================================
   12) PAYLAŞILAN KOD LİNKİ — girişsiz görüntüleme
   ============================================================ */
async function kodLinkiGosterVarsa(){
  const params = new URLSearchParams(location.search);
  const id = params.get("kod");
  if(!id) return false;
  const veri = await veriOku();
  const kod = (veri.kodlar||[]).find(k=>k.id===id);
  const root = document.getElementById("root");
  if(!kod){
    root.innerHTML = `<div class="center-screen"><div class="card"><h2>Kod bulunamadı</h2></div></div>`;
  } else {
    root.innerHTML = `<div class="center-screen" style="align-items:flex-start;padding-top:60px">
      <div class="card" style="max-width:640px">
        <div class="seal">HÜKÜM STUDİO — Paylaşılan Kod</div>
        <h2>${kod.baslik}</h2>
        <p style="color:var(--dim);font-size:.85em">${kod.yazan} — ${kod.tarih}</p>
        <pre style="white-space:pre-wrap;background:var(--panel2);padding:14px;border-radius:8px;font-family:monospace;overflow-x:auto">${escapeHtml(kod.kod)}</pre>
        <a href="${location.pathname}">← Siteye dön</a>
      </div>
    </div>`;
  }
  return true;
}

/* ============================================================
   13) ÇALIŞTIR
   ============================================================ */
(async ()=>{
  const gosterildi = await kodLinkiGosterVarsa();
  if(!gosterildi) basla();
})();
</script>
