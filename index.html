<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HÜKÜM Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>HÜKÜM Studio</h1>
        <p>Resmi Discord ve Yönetim Paneli</p>
    </header>

    <main>
        <!-- Yönetim Ekibi Bölümü -->
        <section>
            <h2>👑 Yönetim Ekibi</h2>
            <div id="yonetim-alani" class="yonetim-listesi">
                <!-- Bot buraya otomatik ekleyecek -->
            </div>
        </section>

        <!-- Üyeler Bölümü -->
        <section>
            <h2>👥 Kayıtlı Üyeler</h2>
            <div id="uye-alani" class="uye-listesi">
                <!-- Bot buraya otomatik ekleyecek -->
            </div>
        </section>

        <!-- Projeler Bölümü -->
        <section>
            <h2>🚀 Projelerimiz</h2>
            <div id="proje-alani" class="proje-listesi">
                <!-- Bot buraya otomatik ekleyecek -->
            </div>
        </section>
    </main>

    <!-- Site Tuşları ve Etkileşim Alanı -->
    <div class="panel-tuslari">
        <button id="btn-duyuru" class="site-btn">📢 Duyuruları Gör</button>
        <button id="btn-kurallar" class="site-btn">📜 Kurallar</button>
        <button id="btn-iletisim" class="site-btn">📞 İletişim</button>
    </div>

    <!-- Bildiri / Mesaj Kutusu -->
    <div id="bilgi-kutusu" class="gizli"></div>

    <script src="app.js"></script>
</body>
</html>
