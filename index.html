<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HÜKÜM Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
  <h1>👑 HÜKÜM STUDIO</h1>

  <div class="grup">GENEL</div>
  <a onclick="sekmeAc('ana-sayfa', this)" class="active">🏠 Ana Sayfa</a>
  <a onclick="sekmeAc('duyurular', this)">📢 Duyurular</a>
  <a onclick="sekmeAc('icraatlar', this)">⚡ İcraatlarımız</a>
  <a onclick="sekmeAc('projeler', this)">🚀 Projelerimiz</a>

  <div class="grup">EKİP</div>
  <a onclick="sekmeAc('yonetim', this)">👑 Yönetim Ekibi</a>

  <div class="grup">SİSTEMLER</div>
  <a href="admin.html">⚙️ Site Kontrol</a>
</div>

<div class="content">

  <div id="ana-sayfa" class="tab-icerik aktif">
    <h2>🏠 Ana Sayfa</h2>
    <p>HÜKÜM Studio resmi web platformuna hoş geldiniz.</p>
  </div>

  <div id="duyurular" class="tab-icerik">
    <h2>📢 Duyurular</h2>
    <div id="duyuru-liste"></div>
  </div>

  <div id="icraatlar" class="tab-icerik">
    <h2>⚡ İcraatlarımız</h2>
    <div id="icraat-liste"></div>
  </div>

  <div id="projeler" class="tab-icerik">
    <h2>🚀 Projelerimiz</h2>
    <div id="proje-liste"></div>
  </div>

  <div id="yonetim" class="tab-icerik">
    <h2>👑 Yönetim Ekibi</h2>
    <div id="yonetim-liste"></div>
  </div>

</div>

<script>
function sekmeAc(id, el){
  document.querySelectorAll('.tab-icerik').forEach(e=>e.classList.remove('aktif'));
  document.getElementById(id).classList.add('aktif');
  document.querySelectorAll('.sidebar a').forEach(a=>a.classList.remove('active'));
  if(el) el.classList.add('active');
}

fetch('content.json?_=' + Date.now())
  .then(r => r.json())
  .then(veri => {
    const dList = document.getElementById('duyuru-liste');
    dList.innerHTML = (veri.duyurular && veri.duyurular.length)
      ? veri.duyurular.slice().reverse().map(d => `
        <div class="kart">
          <div class="baslik">${d.baslik}</div>
          <div>${d.metin}</div>
          <div class="tarih">${d.tarih}</div>
        </div>`).join('')
      : '<p>Henüz duyuru yok.</p>';

    const iList = document.getElementById('icraat-liste');
    iList.innerHTML = (veri.icraatlar && veri.icraatlar.length)
      ? veri.icraatlar.slice().reverse().map(i => `
        <div class="kart">
          <div class="baslik">${i.baslik}</div>
          <div>${i.aciklama}</div>
          <div class="tarih">${i.tarih}</div>
        </div>`).join('')
      : '<p>Henüz icraat eklenmedi.</p>';

    const pList = document.getElementById('proje-liste');
    pList.innerHTML = (veri.projeler && veri.projeler.length)
      ? veri.projeler.map(p => `
        <div class="kart">
          ${p.resim ? `<img src="${p.resim}" style="max-width:100%;border-radius:6px;margin-bottom:10px">` : ''}
          <div class="baslik">${p.isim}</div>
          <div>${p.tanitim}</div>
          <div style="color:#8b949e;margin-top:6px">Amaç: ${p.amac}</div>
        </div>`).join('')
      : '<p>Henüz proje yok.</p>';

    const yList = document.getElementById('yonetim-liste');
    yList.innerHTML = (veri.yonetim && veri.yonetim.length)
      ? veri.yonetim.map(y => `
        <div class="kart" style="display:flex;align-items:center;gap:14px">
          ${y.resim ? `<img src="${y.resim}" style="width:50px;height:50px;border-radius:50%">` : '<div style="width:50px;height:50px;border-radius:50%;background:#21262d"></div>'}
          <div>
            <div class="baslik">${y.isim}</div>
            <span class="rozet">${y.rol}</span>
          </div>
        </div>`).join('')
      : '<p>Henüz yönetim ekibi eklenmedi.</p>';
  })
  .catch(() => {
    document.getElementById('duyuru-liste').innerHTML = '<p>content.json yüklenemedi. Dosyanın index.html ile aynı klasörde olduğundan emin ol.</p>';
  });
</script>

</body>
</html>
